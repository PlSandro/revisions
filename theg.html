<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("theg-data").textContent);
var CH = DATA.chapters;

/* ---------- stockage tolerant ---------- */
var mem = {};
var store = {
  get: function(k){
    try { var v = window.localStorage.getItem(k); return v === null ? mem[k] : v; }
    catch(e){ return mem[k]; }
  },
  set: function(k, v){
    mem[k] = v;
    try { window.localStorage.setItem(k, v); } catch(e){}
  }
};
var KEY = "theg.v1";
var state = {solved:{}, quiz:{}, code:{}};
try {
  var raw = store.get(KEY);
  if (raw) {
    var p = JSON.parse(raw);
    state.solved = p.solved || {};
    state.quiz   = p.quiz   || {};
    state.code   = p.code   || {};
  }
} catch(e){}
function save(){ try { store.set(KEY, JSON.stringify(state)); } catch(e){} }

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function el(html){ var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }

var allExos = [];
CH.forEach(function(c){ c.exercises.forEach(function(e){ allExos.push(e); }); });

/* =========================================================
   Pyodide : chaîne de CDN, dégradation propre
   ========================================================= */
var CDNS = [
  "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/",
  "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/",
  "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/"
];
var py = null, pyState = "loading", pyMsg = "";
var statusBox = null;

function setStatus(cls, title, body){
  if (!statusBox){
    statusBox = el('<div class="pystatus"></div>');
    document.body.appendChild(statusBox);
  }
  statusBox.className = "pystatus " + (cls || "");
  statusBox.innerHTML = '<b>' + title + '</b>' + (body || "");
}

function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = src;
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error("script")); };
    document.head.appendChild(s);
  });
}

var HARNESS = [
"import json, sys, io, traceback",
"sys.setrecursionlimit(6000)",
"def _theg_run(payload):",
"    d = json.loads(payload)",
"    res = {'ok': False, 'error': None, 'stdout': '', 'tests': []}",
"    env = {}",
"    buf = io.StringIO()",
"    old = sys.stdout",
"    sys.stdout = buf",
"    try:",
"        exec(compile(d['prelude'] + chr(10) + d['user'], 'votre_code', 'exec'), env)",
"    except Exception:",
"        sys.stdout = old",
"        res['stdout'] = buf.getvalue()",
"        res['error'] = traceback.format_exc()",
"        return json.dumps(res)",
"    sys.stdout = old",
"    res['stdout'] = buf.getvalue()",
"    tout = True",
"    for t in d['tests']:",
"        item = {'label': t['label'], 'ok': False, 'msg': ''}",
"        loc = dict(env)",
"        b2 = io.StringIO()",
"        s0 = sys.stdout",
"        sys.stdout = b2",
"        try:",
"            if t.get('setup'):",
"                exec(compile(t['setup'], 'test', 'exec'), loc)",
"            v = eval(compile(t['expr'], 'test', 'eval'), loc)",
"            if v is True:",
"                item['ok'] = True",
"            else:",
"                item['msg'] = 'a renvoyé ' + repr(v) + ' au lieu de True'",
"        except Exception as e:",
"            item['msg'] = type(e).__name__ + ': ' + str(e)",
"        finally:",
"            sys.stdout = s0",
"        if not item['ok']:",
"            tout = False",
"        res['tests'].append(item)",
"    res['ok'] = tout",
"    return json.dumps(res)"
].join("\n");

function bootPython(){
  setStatus("", '<span class="dotpulse"></span>Python démarre…',
            "chargement de l'interpréteur");
  var i = 0;
  function tryNext(){
    if (i >= CDNS.length){
      pyState = "off";
      setStatus("err", "Python indisponible",
        "Le réseau ou la politique de sécurité de cette page bloque le chargement. " +
        "Tout le reste fonctionne : énoncés, indices, corrigés et quiz. " +
        "Pour exécuter le code, ouvre le fichier téléchargé dans ton navigateur.");
      document.querySelectorAll(".btn.run").forEach(function(b){
        b.disabled = true; b.textContent = "Python indisponible";
      });
      return;
    }
    var url = CDNS[i++];
    loadScript(url + "pyodide.js").then(function(){
      return window.loadPyodide({indexURL: url});
    }).then(function(p){
      py = p;
      py.runPython(HARNESS);
      pyState = "on";
      setStatus("ok", "Python prêt", "Tu peux exécuter les exercices.");
      setTimeout(function(){ if (statusBox) statusBox.remove(); statusBox = null; }, 3200);
      document.querySelectorAll(".btn.run").forEach(function(b){
        b.disabled = false; b.textContent = "Exécuter les tests";
      });
    }).catch(function(){ tryNext(); });
  }
  tryNext();
}

function runExo(exo, code){
  var payload = JSON.stringify({
    prelude: exo.prelude || "",
    user: code,
    tests: exo.tests
  });
  py.globals.set("_theg_payload", payload);
  var out = py.runPython("_theg_run(_theg_payload)");
  return JSON.parse(out);
}

function svgOpen(w, h){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<g filter="url(#ck)">';
}
function line(x1,y1,x2,y2,col,w,delay){
  var L = Math.round(Math.hypot(x2-x1, y2-y1)) + 2;
  return '<line class="chalkline drawin" style="--len:'+L+';animation-delay:'+delay+'s" x1="'+x1+'" y1="'+y1+
    '" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+(w||1.6)+'"/>';
}
function node(x,y,r,col,delay,fill){
  return '<circle class="fadein" style="animation-delay:'+delay+'s" cx="'+x+'" cy="'+y+'" r="'+r+
    '" fill="'+(fill||"#0A0D12")+'" stroke="'+col+'" stroke-width="1.6"/>';
}
function txt(x,y,s,col,size,delay){
  return '<text class="fadein" style="animation-delay:'+delay+'s" x="'+x+'" y="'+y+
    '" fill="'+col+'" font-size="'+(size||9)+'" font-family="ui-monospace,monospace" ' +
    'text-anchor="middle" dominant-baseline="central">'+s+'</text>';
}

/* ch5 : couplage biparti */
FIG.ch5 = function(){

/* =========================================================
   Rail : navigation + graphe de progression
   ========================================================= */
var railNav, railProg, railStat;

function chDone(c){
  var n = 0;
  c.exercises.forEach(function(e){ if (state.solved[e.id]) n++; });
  return n;
}

function buildRail(){
  var r = document.querySelector(".rail");
  r.innerHTML =
    '<a href="index.html" class="home-btn">← Index</a>' +
    '<div class="brand">THEG<small>théorie des graphes</small></div>' +
    '<nav class="chapters" aria-label="Chapitres"></nav>' +
    '<div class="panelbox"><h3>Progression</h3><div class="pgrid"></div>' +
    '<div class="stat"></div><button class="linkbtn">Tout réinitialiser</button></div>';
  railNav  = r.querySelector(".chapters");
  railProg = r.querySelector(".pgrid");
  railStat = r.querySelector(".stat");
  CH.forEach(function(c, i){
    var b = el('<button type="button"><span class="cnum">' + c.num + '</span>' +
               '<span class="cttl">' + esc(c.title) + '</span><span class="cdone"></span></button>');
    b.addEventListener("click", function(){ show(i); });
    railNav.appendChild(b);
  });
  r.querySelector(".linkbtn").addEventListener("click", function(){
    if (!window.confirm("Effacer toute la progression et le code saisi ?")) return;
    state = {solved:{}, quiz:{}, code:{}};
    save();
    show(current);
    paintRail();
  });
  paintRail();
}

function paintRail(){
  var btns = railNav.querySelectorAll("button");
  CH.forEach(function(c, i){
    btns[i].setAttribute("aria-current", i === current ? "true" : "false");
    btns[i].querySelector(".cdone").textContent = chDone(c) + "/" + c.exercises.length;
  });
  var rows = "";
  CH.forEach(function(c){
    var k = c.exercises.length, W = 100, gap = k > 1 ? W / (k - 1) : 0;
    var sv = '<svg viewBox="0 0 104 14" preserveAspectRatio="none">';
    for (var j = 0; j < k - 1; j++){
      var a = 2 + j * gap, b = 2 + (j + 1) * gap;
      var both = state.solved[c.exercises[j].id] && state.solved[c.exercises[j+1].id];
      sv += '<line x1="'+a+'" y1="7" x2="'+b+'" y2="7" stroke="'+(both?"#86E08C":"#26303F")+
            '" stroke-width="1.2"/>';
    }
    for (var j2 = 0; j2 < k; j2++){
      var cx = 2 + j2 * gap, on = !!state.solved[c.exercises[j2].id];
      sv += '<circle cx="'+cx+'" cy="7" r="3.1" fill="'+(on?"#86E08C":"#0A0D12")+
            '" stroke="'+(on?"#86E08C":"#3A4759")+'" stroke-width="1.2"/>';
    }
    sv += '</svg>';
    rows += '<div class="prow"><span class="lbl">' + c.num + '</span><span class="pnodes">' + sv + '</span></div>';
  });
  railProg.innerHTML = rows;
  var tot = allExos.length, done = 0;
  allExos.forEach(function(e){ if (state.solved[e.id]) done++; });
  railStat.innerHTML = '<b>' + done + '</b> / ' + tot + ' exercices résolus';
}

/* =========================================================
   Rendu d'un chapitre
   ========================================================= */
var current = 0, currentTab = "notions";

function show(i, tab){
  current = i;
  currentTab = tab || "notions";
  var c = CH[i];
  var stage = document.querySelector(".stage");
  var srcs = c.sources.map(function(s){ return '<span>' + esc(s) + '</span>'; }).join("");
  stage.innerHTML =
    '<header class="hero">' +
      '<div><div class="eyebrow">Chapitre ' + c.num + '</div>' +
      '<h1>' + esc(c.title) + '</h1>' +
      '<p class="sub">' + esc(c.subtitle) + '</p>' +
      '<p class="blurb">' + esc(c.blurb) + '</p>' +
      '<div class="sources">' + srcs + '</div></div>' +
      '<div class="herofig">' + (FIG[c.id] ? FIG[c.id]() : "") + '</div>' +
    '</header>' +
    '<div class="tabs" role="tablist">' +
      '<button role="tab" data-t="notions">Notions<span class="count">' +
        c.notions.filter(function(x){ return !x.section; }).length + '</span></button>' +
      '<button role="tab" data-t="quiz">Quiz<span class="count">' + c.quiz.length + '</span></button>' +
      '<button role="tab" data-t="exos">Exercices<span class="count">' + c.exercises.length + '</span></button>' +
    '</div>' +
    '<section class="panel" data-panel="notions"></section>' +
    '<section class="panel" data-panel="quiz"></section>' +
    '<section class="panel" data-panel="exos"></section>';

  stage.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click", function(){ setTab(b.dataset.t); });
  });
  renderNotions(c, stage.querySelector('[data-panel="notions"]'));
  renderQuiz(c, stage.querySelector('[data-panel="quiz"]'));
  renderExos(c, stage.querySelector('[data-panel="exos"]'));
  setTab(currentTab);
  paintRail();
  window.scrollTo(0, 0);
}

function setTab(t){
  currentTab = t;
  var stage = document.querySelector(".stage");
  stage.querySelectorAll(".tabs button").forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.t === t ? "true" : "false");
  });
  stage.querySelectorAll(".panel").forEach(function(p){
    p.hidden = p.dataset.panel !== t;
  });
}

  s += txt(100,110,"0 et 3 sont libres",Y,10,0.85);
  s += txt(100,126,"le chemin alterne",C,10,0.95);
  s += '<text class="fadein" style="animation-delay:.9s" x="210" y="72" fill="'+G+
       '" font-size="17" font-family="ui-monospace,monospace" text-anchor="middle" '+
       'dominant-baseline="central">&#8853;</text>';
  s += ch(216,[0,2],"M (+) P",0.5,false);
  s += txt(310,110,"une arête de plus",G,10,1.25);
  return s + "</g></svg>";
};

    {c:C,p:[[186,44],[232,68],[186,96]],e:[[0,1],[1,2]]},
    {c:M,p:[[336,66]],e:[]}

  blocs.forEach(function(b){

    });

NFIG.cfc = function(){
  var s = svgOpen(420,150);
  var P=[[60,50],[130,50],[130,110],[60,110],[250,80],[340,50],[340,110]];
  var arcs=[[0,1],[1,2],[2,3],[3,0],[1,4],[4,5],[5,6],[6,4]];
  arcs.forEach(function(e,i){

    s += line(P[e[0]][0],P[e[0]][1],P[e[1]][0],P[e[1]][1], intra?G:M, intra?1.9:1.5, i*0.09);

function renderNotions(c, box){
  var wrap = el('<div class="notions"></div>');
  c.notions.forEach(function(n){
    if (n.section){
      wrap.appendChild(el('<div class="nsec"><h2>' + esc(n.section) + '</h2>' +
        (n.intro ? '<p>' + esc(n.intro) + '</p>' : '') + '<div class="rule"></div></div>'));
      return;
    }
    var h = '<article class="notion ' + n.kind + '">' +
            '<span class="kind">' + (KINDS[n.kind] || n.kind) + '</span>' +
            '<h3>' + n.title + '</h3>';
    if (n.lead)    h += '<p class="lead">' + n.lead + '</p>';
    if (n.body)    h += '<div class="nbody">' + n.body + '</div>';
    if (n.formula) h += '<div class="formula">' + n.formula + '</div>';
    if (n.fig && NFIG[n.fig]) h += '<div class="nfig">' + NFIG[n.fig]() + '</div>';
    if (n.ex)      h += '<div class="nex"><div class="exlab">exemple</div><pre>' +
                        esc(n.ex) + '</pre></div>';
    h += '</article>';
    var art = el(h);
    if (n.see && n.see.length){
      var see = el('<div class="see"><span class="lbl">à pratiquer</span></div>');
      n.see.forEach(function(id){
        var b = el('<button type="button">' + id + '</button>');
        b.addEventListener("click", function(){ gotoExo(id); });
        see.appendChild(b);
      });
      art.appendChild(see);
    }
    wrap.appendChild(art);
  });
  box.innerHTML = "";
  box.appendChild(wrap);
}

function gotoExo(id){
  setTab("exos");
  var stage = document.querySelector(".stage");
  var cards = stage.querySelectorAll(".exo");
  for (var i = 0; i < cards.length; i++){
    var tag = cards[i].querySelector(".exoid");
    if (tag && tag.textContent === id){
      var body = cards[i].querySelector(".exobody");
      if (body.hidden) cards[i].querySelector(".exohead").click();
      cards[i].scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
  }
}

function renderQuiz(c, box){
  var st = state.quiz[c.id] || (state.quiz[c.id] = {});
  var head = el('<div class="quizscore"></div>');
  var wrap = el('<div class="quiz"></div>');
  function score(){
    var ans = 0, good = 0;
    c.quiz.forEach(function(q, i){
      if (st[i] !== undefined){ ans++; if (st[i] === q.answer) good++; }
    });
    head.textContent = ans === 0
      ? c.quiz.length + " questions — clique sur une réponse"
      : good + " / " + ans + " correctes (" + ans + " répondues sur " + c.quiz.length + ")";
  }
  c.quiz.forEach(function(q, i){
    var card = el('<article class="q"><div class="qh"><span class="qn">' + (i + 1) +
      '</span><span class="qt">' + esc(q.q) + '</span></div><div class="choices"></div></article>');
    var ch = card.querySelector(".choices");
    q.choices.forEach(function(txt2, j){
      var b = el('<button type="button">' + esc(txt2) + '</button>');
      b.addEventListener("click", function(){
        if (st[i] !== undefined) return;
        st[i] = j; save(); paint();
      });
      ch.appendChild(b);
    });
    function paint(){
      var bs = ch.querySelectorAll("button");
      var picked = st[i];
      bs.forEach(function(b, j){
        b.className = ""; b.disabled = picked !== undefined;
        if (picked === undefined) return;
        if (j === q.answer) b.className = "good";
        else if (j === picked) b.className = "bad";
      });
      var old = card.querySelector(".why");
      if (old) old.remove();
      if (picked !== undefined){
        var ok = picked === q.answer;
        card.appendChild(el('<div class="why"><b>' + (ok ? "Exact." : "Non.") + '</b> ' + q.why + '</div>'));
      }
      score();
    }
    paint();
    wrap.appendChild(card);
  });
  box.innerHTML = "";
  box.appendChild(head);
  box.appendChild(wrap);
  score();
}

function renderExos(c, box){
  var wrap = el('<div class="exos"></div>');
  c.exercises.forEach(function(exo){ wrap.appendChild(exoCard(exo)); });
  box.innerHTML = "";
  box.appendChild(wrap);
}

function exoCard(exo){
  var done = !!state.solved[exo.id];
  var dots = "";
  for (var i = 1; i <= 4; i++) dots += '<i class="' + (i <= exo.difficulty ? "on" : "") + '"></i>';
  var card = el(
    '<article class="exo' + (done ? " done" : "") + '">' +
      '<div class="exohead" role="button" tabindex="0">' +
        '<span class="exoid">' + exo.id + '</span>' +
        '<span class="exottl">' + esc(exo.title) + '</span>' +
        '<span class="dots" title="difficulté ' + exo.difficulty + '/4">' + dots + '</span>' +
        '<span class="badge">' + (done ? "résolu" : "à faire") + '</span>' +
      '</div>' +
      '<div class="exobody" hidden></div>' +
    '</article>');

  var head = card.querySelector(".exohead");
  var body = card.querySelector(".exobody");
  var built = false;

  function toggle(){
    if (!built){ buildBody(); built = true; }
    body.hidden = !body.hidden;
  }
  head.addEventListener("click", toggle);
  head.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
  });

  function buildBody(){
    body.innerHTML = '<div class="stmt">' + exo.statement + '</div>';

    if (exo.prelude){
      body.appendChild(el(
        '<details class="given"><summary>Code fourni (déjà exécuté avant le tien)</summary>' +
        '<pre><code>' + esc(exo.prelude.replace(/\s+$/, "")) + '</code></pre></details>'));
    }

    var start = state.code[exo.id] !== undefined ? state.code[exo.id] : exo.starter;
    var edw = el('<div class="edwrap"><div class="edlabel">ton code</div>' +
                 '<textarea class="ed" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea></div>');
    var ta = edw.querySelector("textarea");
    ta.value = start;
    ta.rows = Math.max(7, start.split("\n").length + 2);
    ta.addEventListener("input", function(){
      state.code[exo.id] = ta.value; save();
    });
    ta.addEventListener("keydown", function(e){
      if (e.key === "Tab"){
        e.preventDefault();
        var s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 4;
      } else if (e.key === "Enter"){
        var p = ta.value.lastIndexOf("\n", ta.selectionStart - 1);
        var lineStr = ta.value.slice(p + 1, ta.selectionStart);
        var ind = (lineStr.match(/^[ \t]*/) || [""])[0];
        if (/:\s*$/.test(lineStr)) ind += "    ";
        if (ind){
          e.preventDefault();
          var s2 = ta.selectionStart;
          ta.value = ta.value.slice(0, s2) + "\n" + ind + ta.value.slice(ta.selectionEnd);
          ta.selectionStart = ta.selectionEnd = s2 + 1 + ind.length;
        }
      }
    });
    body.appendChild(edw);

    var acts = el('<div class="actions">' +
      '<button class="btn run" type="button">' +
        (pyState === "on" ? "Exécuter les tests" : (pyState === "off" ? "Python indisponible" : "Python démarre…")) +
      '</button>' +
      '<button class="btn ghost bhint" type="button">Indice</button>' +
      '<button class="btn ghost bsol" type="button">Voir le corrigé</button>' +
      '<button class="btn ghost breset" type="button">Repartir de zéro</button>' +
    '</div>');
    body.appendChild(acts);

    var out = el('<div class="out"></div>');
    body.appendChild(out);

    var runBtn = acts.querySelector(".run");
    runBtn.disabled = pyState !== "on";
    runBtn.addEventListener("click", function(){
      if (pyState !== "on") return;
      out.innerHTML = '<div class="summ wait">exécution…</div>';
      runBtn.disabled = true;
      setTimeout(function(){
        var r;
        try { r = runExo(exo, ta.value); }
        catch(err){ r = {ok:false, error:String(err), stdout:"", tests:[]}; }
        paintResult(r);
        runBtn.disabled = false;
      }, 30);
    });

    function paintResult(r){
      var h = "";
      var passed = r.tests.filter(function(t){ return t.ok; }).length;
      if (r.error){
        h += '<div class="summ no">le code n\'a pas pu s\'exécuter</div>';
        h += '<div class="trace">' + esc(r.error) + '</div>';
      } else {
        h += '<div class="summ ' + (r.ok ? "ok" : "no") + '">' +
             (r.ok ? "tous les tests passent — " : "") +
             passed + " / " + r.tests.length + " tests réussis</div>";
      }
      if (r.stdout) h += '<div class="stdout">' + esc(r.stdout) + '</div>';
      r.tests.forEach(function(t){
        h += '<div class="res ' + (t.ok ? "ok" : "no") + '"><span class="m">' +
             (t.ok ? "✓" : "✗") + '</span><span class="t">' + esc(t.label) +
             (t.msg ? '<span class="e">' + esc(t.msg) + '</span>' : "") + '</span></div>';
      });
      out.innerHTML = h;
      if (r.ok && !state.solved[exo.id]){
        state.solved[exo.id] = true; save();
        card.classList.add("done");
        card.querySelector(".badge").textContent = "résolu";
        paintRail();
      }
    }

    var shown = 0;
    acts.querySelector(".bhint").addEventListener("click", function(){
      if (shown >= exo.hints.length) return;
      body.insertBefore(
        el('<div class="hint"><b>Indice ' + (shown + 1) + ' sur ' + exo.hints.length + '</b>' +
           esc(exo.hints[shown]) + '</div>'), out);
      shown++;
      if (shown >= exo.hints.length) acts.querySelector(".bhint").disabled = true;
    });

    acts.querySelector(".bsol").addEventListener("click", function(){
      var b = acts.querySelector(".bsol");
      if (body.querySelector(".soln")){
        body.querySelector(".soln").remove();
        b.textContent = "Voir le corrigé";
        return;
      }
      body.insertBefore(
        el('<div class="soln"><pre><code>' + esc(exo.solution.replace(/\s+$/, "")) + '</code></pre></div>'), out);
      b.textContent = "Masquer le corrigé";
    });

    acts.querySelector(".breset").addEventListener("click", function(){
      ta.value = exo.starter;
      state.code[exo.id] = exo.starter;
      save();
      out.innerHTML = "";
    });
  }

  return card;
}

/* =========================================================
   Démarrage
   ========================================================= */
buildRail();
show(0);
bootPython();

})();
</script>
</body>
