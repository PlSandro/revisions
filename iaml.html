<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAML — révision pour le rattrapage</title>
<meta name="description" content="Révision ciblée IAML : 25 fiches, 50 questions dont 36 tombées à l'examen, calculs minutés, examen blanc de 30 minutes et fiche A4.">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0B0F14; --card:#131A23; --card2:#18212C; --line:#26323F;
  --ink:#ECEFF3; --dim:#93A0AF; --faint:#5D6C7C;
  --acc:#5BC8AF; --acc2:#7FB2F0; --warn:#F2A65A; --bad:#F0736A; --good:#7ED9A0; --purple:#B79CF0;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.01em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:.9em;background:#1C2530;padding:.1em .35em;border-radius:3px;color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.shell{display:flex;min-height:100vh}
.rail{width:252px;flex:0 0 252px;background:var(--card);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 16px 26px;display:flex;
  flex-direction:column;gap:18px}
.stage{flex:1;min-width:0;padding:30px 38px 90px;max-width:1020px}
.brand{font-family:var(--serif);font-size:25px;letter-spacing:.13em;line-height:1}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--faint);margin-top:6px}
.navsec{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin:6px 0 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;background:none;
  border:0;border-radius:5px;padding:7px 9px;color:var(--dim);font-size:13.5px;transition:.15s}
.nav button:hover{background:var(--card2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--card2);color:var(--ink)}
.nav button[aria-current="true"] .n{color:var(--acc)}
.n{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto}
.nav .sc{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.railfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.railfoot .k{font-family:var(--mono);font-size:11px;color:var(--dim)}
.railfoot .k b{color:var(--acc)}
.linkbtn{background:none;border:0;color:var(--faint);font-size:11px;text-decoration:underline;
  padding:0;margin-top:9px}
.linkbtn:hover{color:var(--bad)}

.hero{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--acc);margin-bottom:10px}
.hero h1{font-size:36px;line-height:1.1;margin-bottom:7px}
.hero .sub{color:var(--acc2);font-size:14px;margin:0 0 13px}
.hero .blurb{color:var(--dim);font-size:14.5px;max-width:60ch;margin:0}

.tabs{display:flex;gap:3px;margin:0 0 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);
  padding:9px 14px;font-size:13px;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.tabs .c{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:5px}
.panel[hidden]{display:none}

/* fiches */
.notions{display:grid;gap:15px;max-width:800px}
.nsec{margin:24px 0 2px}
.notions>.nsec:first-child{margin-top:0}
.nsec h2{font-size:22px;margin-bottom:6px}
.nsec p{margin:0;color:var(--faint);font-size:14px;max-width:62ch}
.nsec .rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin-top:14px}
.notion{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:17px 19px;
  border-left:3px solid var(--faint)}
.notion h3{font-family:var(--sans);font-size:15px;font-weight:650;margin-bottom:8px}
.notion .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  display:block;margin-bottom:6px}
.notion .lead{font-family:var(--serif);font-size:17px;line-height:1.45;color:var(--ink);
  margin:0 0 12px;max-width:56ch}
.nbody{color:var(--dim);font-size:14.2px}
.nbody p{margin:0 0 10px}.nbody p:last-child{margin-bottom:0}
.nbody strong{color:var(--ink);font-weight:600}.nbody em{color:var(--ink)}
.notion.def{border-left-color:var(--acc)}.notion.def .kind{color:var(--acc)}
.notion.thm{border-left-color:var(--acc2)}.notion.thm .kind{color:var(--acc2)}
.notion.algo{border-left-color:var(--good)}.notion.algo .kind{color:var(--good)}
.notion.warn{border-left-color:var(--warn)}.notion.warn .kind{color:var(--warn)}
.formula{margin:13px 0;padding:12px 15px;background:#0A0E14;border:1px solid var(--line);
  border-radius:6px;text-align:center;font-family:var(--serif);font-size:16px;color:var(--acc);
  line-height:1.7;overflow-x:auto}
.nex{margin:13px 0 0;background:#080C11;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.nex .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);padding:6px 13px;border-bottom:1px solid var(--line);background:#0D141C}
.nex pre{margin:0;font-family:var(--mono);font-size:12.3px;line-height:1.6;color:#C2CDDA;
  padding:12px 15px;overflow-x:auto;white-space:pre}
.nfig{margin:13px 0 0;display:flex;justify-content:center;background:#080C11;
  border:1px solid var(--line);border-radius:6px;padding:13px 10px}
.nfig svg{width:100%;max-width:430px;height:auto}
.see{margin-top:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.see .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.see button{background:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px;
  font-family:var(--mono);font-size:10.5px;color:var(--acc2)}
.see button:hover{border-color:var(--acc2);background:#101C29}

/* questions */
.qwrap{display:grid;gap:12px;max-width:790px}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.q.done{border-color:#2B4A3C}
.qh{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.qn{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:0 0 auto}
.tagx{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--faint);flex:0 0 auto}
.tagx.ex{border-color:#5A4A2A;color:var(--warn)}
.qt{font-size:14.5px;font-weight:500;margin-bottom:11px}
.multi-hint{font-family:var(--mono);font-size:10.5px;color:var(--warn);margin-bottom:9px}
.ch{display:grid;gap:6px}
.ch button{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:5px;
  padding:9px 12px;color:var(--dim);font-size:13.5px;transition:.14s;display:flex;gap:9px}
.ch button:hover:not(:disabled){border-color:var(--faint);color:var(--ink)}
.ch button .bx{font-family:var(--mono);flex:0 0 auto;color:var(--faint)}
.ch button.sel{border-color:var(--acc2);color:var(--ink)}
.ch button.sel .bx{color:var(--acc2)}
.ch button.good{border-color:var(--good);color:var(--good);background:#0D1F16}
.ch button.good .bx{color:var(--good)}
.ch button.bad{border-color:var(--bad);color:var(--bad);background:#1F1113}
.ch button.bad .bx{color:var(--bad)}
.ch button.miss{border-color:var(--warn);background:#1C1509}
.ch button.miss .bx{color:var(--warn)}
.ch button:disabled{cursor:default}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input{background:#080C11;border:1px solid var(--line);border-radius:5px;padding:8px 12px;
  color:var(--ink);font-family:var(--mono);font-size:14px;width:150px}
.numin input:focus{outline:none;border-color:var(--acc)}
.act{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--dim);border-radius:5px;
  padding:7px 14px;font-size:13px;transition:.14s}
.btn:hover:not(:disabled){color:var(--ink);border-color:var(--faint)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{border-color:var(--acc);color:var(--acc)}
.btn.p:hover:not(:disabled){background:#0C201B}
.why{margin-top:11px;padding:10px 13px;background:#080C11;border-left:2px solid var(--acc2);
  border-radius:4px;font-size:13.2px;color:var(--dim)}
.why b{color:var(--acc2)}
.score{font-family:var(--mono);font-size:11.5px;margin-top:9px}
.score.ok{color:var(--good)}.score.part{color:var(--warn)}.score.no{color:var(--bad)}
.bar{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:16px;
  background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.bar b{color:var(--acc)}

/* drills */
.dgrid{display:grid;gap:12px;max-width:790px}
.drill{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.drill h3{font-family:var(--sans);font-size:14.5px;font-weight:650;margin-bottom:4px}
.drill .d{color:var(--faint);font-size:12.5px;margin-bottom:12px}
.dstate{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:10px}
.dstate .ok{color:var(--good)}.dstate .no{color:var(--bad)}
.dq{background:#080C11;border:1px solid var(--line);border-radius:6px;padding:12px 15px;
  font-family:var(--mono);font-size:12.5px;color:#C2CDDA;white-space:pre;overflow-x:auto;margin-bottom:11px}
.streak{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}

/* exam mode */
.exambox{max-width:800px}
.timer{position:sticky;top:0;z-index:20;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:11px 16px;display:flex;align-items:center;gap:16px;margin-bottom:18px}
.timer .t{font-family:var(--mono);font-size:22px;color:var(--acc);font-weight:600}
.timer .t.low{color:var(--bad)}
.timer .prog{flex:1;height:5px;background:var(--card2);border-radius:99px;overflow:hidden}
.timer .prog i{display:block;height:100%;background:var(--acc);transition:width .4s linear}
.timer .meta{font-family:var(--mono);font-size:11px;color:var(--faint)}
.result{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:18px}
.result .big{font-family:var(--serif);font-size:44px;color:var(--acc);line-height:1}
.result .big small{font-size:18px;color:var(--faint)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);padding:6px 8px;font-weight:500}
.tbl td{padding:6px 8px;border-bottom:1px solid #1A222C;color:var(--dim)}
.tbl td.num{font-family:var(--mono);text-align:right}
.tbl tr:last-child td{border-bottom:0}
.pill{display:inline-block;height:6px;border-radius:99px;background:var(--acc);vertical-align:middle}
.pill.lo{background:var(--bad)}.pill.mid{background:var(--warn)}

/* bilan */
.lesson{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:8px;padding:16px 19px;margin-bottom:12px}
.lesson h3{font-family:var(--sans);font-size:14.5px;font-weight:650;margin-bottom:7px}
.lesson p{margin:0;color:var(--dim);font-size:14px}
.lesson .gain{font-family:var(--mono);font-size:11px;color:var(--good);margin-top:9px}

/* fiche A4 */
.a4wrap{max-width:900px}
.a4{background:#fff;color:#111;border-radius:4px;padding:14mm 12mm;font-size:8.4px;line-height:1.32;
  font-family:var(--sans);column-count:2;column-gap:7mm;column-rule:1px solid #ccc}
.a4 h2{font-size:11px;font-family:var(--sans);font-weight:800;margin:0 0 3px;
  border-bottom:1.5px solid #111;padding-bottom:1px;break-after:avoid}
.a4 h3{font-size:8.8px;font-family:var(--sans);font-weight:700;margin:6px 0 2px;break-after:avoid}
.a4 p,.a4 ul{margin:0 0 4px}
.a4 ul{padding-left:11px}
.a4 li{margin-bottom:1px}
.a4 .box{border:1px solid #333;padding:3px 5px;margin:0 0 5px;break-inside:avoid;background:#f6f6f6}
.a4 .f{font-family:var(--mono);font-size:8px;background:#eee;padding:1px 3px;border-radius:2px}
.a4 table{width:100%;border-collapse:collapse;font-size:7.6px;margin:0 0 5px}
.a4 th,.a4 td{border:1px solid #999;padding:1.5px 3px;text-align:left}
.a4 th{background:#e8e8e8;font-weight:700}
.a4 .warn{border-left:2.5px solid #111;padding-left:4px;margin:0 0 4px}
@media print{
  body{background:#fff}
  .rail,.tabs,.hero,.noprint{display:none!important}
  .stage{padding:0;max-width:none}
  .a4{column-count:2;padding:0;border-radius:0;font-size:8.4px}
  @page{size:A4 portrait;margin:10mm}
}

@media (max-width:900px){
  .shell{flex-direction:column}
  .rail{position:static;width:auto;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .stage{padding:22px 18px 70px}
  .hero h1{font-size:29px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap;width:auto}
  .nav .sc{display:none}
  .railfoot{margin-top:12px}
  .a4{column-count:1;font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

<script id="iaml-data" type="application/json">{"chapters": [{"id": "c1", "num": 1, "title": "Fondations", "subtitle": "Types de problèmes, supervisé et non supervisé", "blurb": "Savoir nommer un problème avant de choisir un algorithme. C'est la première question de l'examen, et deux questions à choix multiples reposent entièrement dessus.", "notions": [{"section": "Trois familles de problèmes", "intro": "La toute première chose à faire face à un énoncé : regarder ce qu'on doit prédire."}, {"kind": "def", "title": "Régression, classification binaire, multiclasse", "lead": "Ce n'est pas la donnée d'entrée qui décide, c'est la nature de la sortie.", "body": "\u003cp\u003eSi la sortie est un \u003cstrong\u003enombre\u003c/strong\u003e sur une échelle continue, c'est une \u003cstrong\u003erégression\u003c/strong\u003e. Si c'est un choix entre \u003cstrong\u003edeux\u003c/strong\u003e étiquettes, c'est une \u003cstrong\u003eclassification binaire\u003c/strong\u003e. Si c'est un choix parmi \u003cstrong\u003etrois ou plus\u003c/strong\u003e, c'est une \u003cstrong\u003eclassification multiclasse\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eLe piège de l'examen : « prédire le nombre d'actions Microsoft échangées demain ». Des dizaines de millions d'actions, c'est un nombre, donc une régression — même si ce nombre est entier, et même si l'énoncé parle de bourse et donne envie de répondre « aucune de ces réponses ».\u003c/p\u003e", "ex": "prédire le nombre d'actions échangées demain     -\u003e RÉGRESSION\nprédire la météo : ensoleillé / nuageux / pluvieux -\u003e MULTICLASSE (3 catégories)\nprédire si un email est un spam ou non           -\u003e BINAIRE\nprédire le prix d'une maison                     -\u003e RÉGRESSION\nreconnaître un chiffre manuscrit (0 à 9)         -\u003e MULTICLASSE (10 classes)", "see": ["q1", "q2"]}, {"section": "Supervisé ou non supervisé", "intro": "Trois points perdus à l'examen sur ce seul critère. Il tient pourtant en un mot : y a-t-il des étiquettes ?"}, {"kind": "def", "title": "Le critère unique : les labels", "lead": "Si les données d'entraînement portent déjà la réponse, c'est supervisé. Sinon, non supervisé.", "body": "\u003cp\u003e\u003cstrong\u003eSupervisé\u003c/strong\u003e : on dispose de couples (x, y). On apprend à prédire y à partir de x. Régression et classification en font partie.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eNon supervisé\u003c/strong\u003e : on ne dispose que des x. On cherche une structure — des groupes, des axes, des anomalies. Clustering et réduction de dimension en font partie.\u003c/p\u003e\u003cp\u003eLe mot qui trahit un énoncé non supervisé : \u003cem\u003edécouvrir\u003c/em\u003e, \u003cem\u003eregrouper\u003c/em\u003e, \u003cem\u003edéterminer s'il existe des catégories\u003c/em\u003e. Le mot qui trahit un énoncé supervisé : \u003cem\u003eprédire\u003c/em\u003e, \u003cem\u003eà partir de données étiquetées\u003c/em\u003e, \u003cem\u003eapprendre à partir de 50 articles d'hommes et 50 de femmes\u003c/em\u003e.\u003c/p\u003e", "fig": "supervise", "ex": "SUPERVISÉ                              NON SUPERVISÉ\n-------------------------------------  -------------------------------------\nprédire la taille selon l'âge          découvrir des types de patients\nprédire le genre de l'auteur           trouver des sous-catégories de spam\n  (50 articles H + 50 articles F)      regrouper 1000 essais similaires\nclasser une page : enfants / adultes   détecter des anomalies réseau\nprédire les rendements agricoles         sans attaques étiquetées\n\npiège : « une grande collection d'emails CONNUS pour être des spams,\nafin de DÉCOUVRIR s'il existe des sous-catégories » -\u003e NON supervisé.\nIl n'y a qu'une seule classe, donc rien à prédire.", "see": ["q3", "q26"]}, {"kind": "warn", "title": "Quelle méthode est non supervisée ?", "lead": "PCA, K-means et DBSCAN le sont. LDA et NCA ne le sont pas.", "body": "\u003cp\u003eC'est une question de cours pure, tombée telle quelle. LDA (analyse discriminante linéaire) et NCA (analyse des composantes de voisinage) réduisent elles aussi la dimension, mais elles \u003cstrong\u003eutilisent les étiquettes\u003c/strong\u003e pour le faire : elles cherchent les axes qui séparent le mieux les classes connues. Elles sont donc supervisées.\u003c/p\u003e\u003cp\u003ePCA, au contraire, ne regarde que la variance des x, sans jamais consulter y.\u003c/p\u003e", "ex": "NON SUPERVISÉ : PCA, K-means, DBSCAN, Affinity Propagation\nSUPERVISÉ     : LDA, NCA, régression linéaire, régression logistique,\n                arbres de décision, SVM, perceptron", "see": ["q9"]}], "quiz": [{"id": "q1", "exam": true, "topic": "Types de problèmes", "type": "single", "q": "Vous voulez prédire le nombre d'actions Microsoft qui seront échangées demain. De quel type de problème s'agit-il ?", "choices": ["Problème de régression", "Classification binaire", "Classification multiclasse", "Aucune de ces réponses"], "answer": 0, "why": "La sortie est un nombre sur une échelle continue : c'est une régression. Le fait que ce soit un décompte d'actions ne change rien."}, {"id": "q2", "exam": true, "topic": "Types de problèmes", "type": "single", "q": "Chaque jour, la météo est classée en Ensoleillé, Nuageux ou Pluvieux. Vous voulez prédire la météo de demain. De quel type de problème s'agit-il ?", "choices": ["Problème de régression", "Classification binaire", "Classification multiclasse", "Aucune de ces réponses"], "answer": 2, "why": "Trois catégories distinctes, donc classification multiclasse. Deux catégories auraient donné du binaire."}, {"id": "q3", "exam": true, "topic": "Supervisé/Non supervisé", "type": "multi", "q": "Lesquels de ces problèmes traiteriez-vous avec un apprentissage supervisé ? (Cochez toutes les réponses correctes)", "choices": ["À partir de données historiques sur l'âge et la taille des enfants, prédire la taille en fonction de l'âge", "À partir de données sur 1000 patients, déterminer s'il existe différentes catégories de réponse au médicament", "Examiner une collection d'emails connus pour être des spams, afin de découvrir s'il existe des sous-catégories", "À partir de 50 articles d'auteurs masculins et 50 d'auteurs féminins, prédire le genre d'un nouvel auteur", "À partir de dossiers médicaux, déterminer s'il existe différents groupes de patients", "Examiner une page web et déterminer si son contenu est adapté aux enfants ou réservé aux adultes", "À partir de 1000 essais sur l'économie, les regrouper automatiquement en groupes similaires", "À partir des rendements agricoles des 50 dernières années, prédire ceux de l'année prochaine"], "answer": [0, 3, 5, 7], "why": "Supervisé = on a déjà la réponse pour chaque exemple. Les propositions 2, 3, 5 et 7 demandent de DÉCOUVRIR des groupes : ce sont du clustering, donc non supervisé. Attention à la 3 : les emails sont tous des spams, il n'y a donc qu'une classe et rien à prédire."}, {"id": "q9", "exam": true, "topic": "Supervisé/Non supervisé", "type": "multi", "q": "Parmi ces méthodes, lesquelles sont des approches non supervisées ?", "choices": ["DBSCAN", "Analyse en Composantes Principales (PCA)", "Analyse Discriminante Linéaire (LDA)", "K-moyennes", "Analyse des Composantes de Voisinage (NCA)"], "answer": [0, 1, 3], "why": "LDA et NCA utilisent les étiquettes pour choisir leurs axes : elles sont supervisées. PCA ne regarde que la variance des données, sans jamais consulter y."}, {"id": "q26", "exam": true, "topic": "Supervisé/Non supervisé", "type": "multi", "q": "Parmi les tâches suivantes, lesquelles sont des exemples d'apprentissage non supervisé ?", "choices": ["Regrouper des clients selon leur comportement d'achat sans labels", "Classifier des emails comme spam ou non spam à l'aide de données étiquetées", "Prédire les prix des logements à partir de données historiques étiquetées", "Détecter des anomalies dans le trafic réseau sans attaques étiquetées"], "answer": [0, 3], "why": "Les propositions 2 et 3 contiennent explicitement « étiquetées » : elles sont supervisées. Cocher les quatre annule tout et donne 0."}, {"id": "q1b", "topic": "Types de problèmes", "type": "single", "q": "Prédire la note qu'un utilisateur donnera à un film, sur une échelle de 0 à 10 avec une décimale, est un problème de :", "choices": ["Régression", "Classification binaire", "Classification multiclasse", "Clustering"], "answer": 0, "why": "Échelle continue de valeurs ordonnées : régression."}, {"id": "q1c", "topic": "Supervisé/Non supervisé", "type": "single", "q": "Segmenter les clients d'un magasin en groupes, sans savoir à l'avance quels groupes existent, relève de :", "choices": ["l'apprentissage supervisé", "l'apprentissage non supervisé", "la régression", "la classification binaire"], "answer": 1, "why": "Aucune étiquette de départ, on cherche une structure : c'est du clustering, donc non supervisé."}]}, {"id": "c2", "num": 2, "title": "Généralisation", "subtitle": "Sur-apprentissage, sous-apprentissage, validation croisée", "blurb": "Le thème le plus coûteux de ta copie : 6 points en jeu, 0,5 obtenu. Le mécanisme est simple une fois qu'on tient les deux colonnes de remèdes.", "notions": [{"section": "Le diagnostic", "intro": "Deux façons de rater, exactement opposées. Il faut d'abord savoir laquelle on regarde."}, {"kind": "def", "title": "Sous-apprentissage et sur-apprentissage", "lead": "Le modèle est soit trop bête pour apprendre, soit trop malin et il apprend le bruit.", "body": "\u003cp\u003e\u003cstrong\u003eSous-apprentissage\u003c/strong\u003e (underfitting) : le modèle est trop simple. Il se trompe déjà sur les données d'entraînement. Sur une figure, la frontière est une droite grossière qui laisse plein de points du mauvais côté.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSur-apprentissage\u003c/strong\u003e (overfitting) : le modèle est trop complexe. Il est presque parfait sur l'entraînement mais s'effondre sur de nouvelles données. Sur une figure, la frontière est une courbe très tortueuse qui contourne chaque point isolé.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eDans les deux cas la généralisation est mauvaise.\u003c/strong\u003e C'est le demi-point manqué aux questions 5 et 7 : dès que tu identifies l'un des deux défauts, il faut aussi cocher « mauvaises performances de généralisation ».\u003c/p\u003e", "fig": "fitting", "ex": "frontière = une droite, beaucoup d'erreurs visibles  -\u003e SOUS-apprentissage\nfrontière = une courbe tortueuse qui isole des points -\u003e SUR-apprentissage\n\ndans les DEUX cas : mauvaise généralisation.\n               erreur train    erreur test\nsous-app.        élevée          élevée\nsur-app.         très faible     élevée\nbon modèle       faible          faible", "see": ["q5", "q7"]}, {"kind": "warn", "title": "Les deux colonnes de remèdes", "lead": "Chaque remède de gauche est l'exact opposé de celui de droite. C'est là que tu as inversé.", "body": "\u003cp\u003eLa logique : contre le \u003cstrong\u003esous\u003c/strong\u003e-apprentissage on donne \u003cem\u003eplus de puissance\u003c/em\u003e au modèle ; contre le \u003cstrong\u003esur\u003c/strong\u003e-apprentissage on lui en \u003cem\u003eretire\u003c/em\u003e, ou bien on lui donne plus de données.\u003c/p\u003e\u003cp\u003eDeux pièges à connaître. \u003cstrong\u003eAjouter des données d'entraînement ne soigne pas le sous-apprentissage\u003c/strong\u003e : un modèle trop simple restera trop simple, même avec un million d'exemples. Et \u003cstrong\u003el'early stopping ne soigne que le sur-apprentissage\u003c/strong\u003e : arrêter plus tôt un modèle qui n'apprend déjà pas assez ne peut qu'aggraver les choses.\u003c/p\u003e", "formula": "sous-apprentissage \u0026rarr; plus de modèle \u0026nbsp;\u0026middot;\u0026nbsp; sur-apprentissage \u0026rarr; moins de modèle, ou plus de données", "ex": "CONTRE LE SOUS-APPRENTISSAGE      CONTRE LE SUR-APPRENTISSAGE\n--------------------------------  --------------------------------\naugmenter la complexité           utiliser un modèle plus simple\n  (ajouter des paramètres)        réduire le nombre de features\najouter des features pertinentes  augmenter la régularisation (lambda)\nRÉDUIRE la régularisation         augmenter la taille du train\naugmenter le nombre d'époques     early stopping\n\nPIÈGES\n  plus de données     -\u003e n'aide PAS le sous-apprentissage\n  early stopping      -\u003e n'aide PAS le sous-apprentissage\n  réduire le train    -\u003e n'aide JAMAIS, ni l'un ni l'autre", "see": ["q6", "q8"]}, {"section": "Mesurer la généralisation", "intro": "Deux points perdus sur une seule question de validation croisée."}, {"kind": "algo", "title": "Validation croisée à k plis", "lead": "Chaque exemple sert de test exactement une fois : l'erreur est calculée sur la totalité du jeu.", "body": "\u003cp\u003eOn découpe le jeu en k parts égales. On répète k fois : entraîner sur k-1 parts, tester sur celle qui reste. Puis on moyenne les k erreurs.\u003c/p\u003e\u003cp\u003eLa question qui t'a coûté 2 points : sur 1000 emails avec k = 5, \u003cstrong\u003esur combien d'emails l'erreur est-elle calculée ?\u003c/strong\u003e Réponse : \u003cstrong\u003e1000\u003c/strong\u003e. À chaque tour on en teste 200, mais il y a 5 tours et les plis sont disjoints, donc à l'arrivée chaque email a été testé une fois et une seule.\u003c/p\u003e\u003cp\u003eC'est tout l'intérêt de la méthode : on obtient une estimation qui utilise l'intégralité des données, sans jamais tester un exemple sur lequel le modèle s'est entraîné.\u003c/p\u003e", "fig": "kfold", "ex": "1000 emails, k = 5   -\u003e   5 plis de 200\n\n  tour 1 : train 800 | test 200  (plis 2,3,4,5 | pli 1)\n  tour 2 : train 800 | test 200  (plis 1,3,4,5 | pli 2)\n  tour 3 : train 800 | test 200\n  tour 4 : train 800 | test 200\n  tour 5 : train 800 | test 200\n                       -------\n  total testé          1000  \u003c- la réponse attendue", "see": ["q4"]}], "quiz": [{"id": "q5", "exam": true, "topic": "Over/Underfitting", "type": "multi", "q": "La frontière de décision obtenue est une droite grossière, qui laisse de nombreux points du mauvais côté. Que peut-on dire de ce classifieur ?", "choices": ["Il est sujet au sous-apprentissage (underfitting)", "Il aura de bonnes performances de généralisation", "Il est sujet au sur-apprentissage (overfitting)", "Il aura de mauvaises performances de généralisation", "Aucune de ces réponses"], "answer": [0, 3], "why": "Une frontière trop simple qui se trompe déjà sur l'entraînement, c'est du sous-apprentissage. Et un modèle qui sous-apprend généralise mal : il faut cocher les DEUX."}, {"id": "q6", "exam": true, "topic": "Over/Underfitting", "type": "multi", "q": "Le classifieur est en sous-apprentissage. Qu'essayez-vous pour éviter ce problème ?", "choices": ["Utiliser un modèle plus simple", "Augmenter le paramètre de régularisation lambda", "Réduire le nombre de features", "Réduire le paramètre lambda de la régularisation", "Augmenter la taille de l'ensemble d'entraînement", "Ajouter plus de features pertinentes", "Augmenter le nombre d'époques d'entraînement", "Réduire la taille de l'ensemble d'entraînement", "Augmenter la complexité du modèle", "Utiliser l'early stopping"], "answer": [3, 5, 6, 8], "why": "Contre le sous-apprentissage, on donne plus de puissance au modèle : plus de paramètres, plus de features, moins de régularisation, plus d'époques. Ajouter des données d'entraînement n'y change rien, et l'early stopping aggraverait le problème."}, {"id": "q7", "exam": true, "topic": "Over/Underfitting", "type": "multi", "q": "La frontière de décision obtenue est une courbe très tortueuse, qui contourne chaque point isolé. Que peut-on dire de ce classifieur ?", "choices": ["Aucune de ces réponses", "Il est sujet au sous-apprentissage (underfitting)", "Il aura de mauvaises performances de généralisation", "Il aura de bonnes performances de généralisation", "Il est sujet au sur-apprentissage (overfitting)"], "answer": [2, 4], "why": "Une frontière qui épouse chaque point mémorise le bruit : c'est du sur-apprentissage, et la généralisation sera mauvaise. Là encore, deux cases."}, {"id": "q8", "exam": true, "topic": "Over/Underfitting", "type": "multi", "q": "Le classifieur est en sur-apprentissage. Qu'essayez-vous pour éviter ce problème ?", "choices": ["Augmenter la complexité du modèle", "Réduire le paramètre lambda de la régularisation", "Réduire la taille de l'ensemble d'entraînement", "Ajouter plus de features pertinentes", "Utiliser un modèle plus simple", "Augmenter la taille de l'ensemble d'entraînement", "Réduire le nombre de features", "Utiliser l'early stopping", "Augmenter le nombre d'époques d'entraînement", "Augmenter le paramètre de régularisation lambda"], "answer": [4, 5, 7, 9], "why": "Contre le sur-apprentissage : simplifier le modèle, augmenter la régularisation, collecter plus de données, arrêter tôt. Le corrigé retient ces quatre-là. Réduire le nombre de features va dans le bon sens mais n'était pas compté."}, {"id": "q4", "exam": true, "topic": "Validation croisée", "type": "single", "q": "Un corpus de 1000 emails, un modèle à trois classes, évalué par validation croisée avec k = 5. Sur combien d'emails le taux d'erreur est-il calculé ?", "choices": ["0", "200", "400", "600", "800", "1000", "Aucune de ces réponses"], "answer": 5, "why": "Chaque tour teste 200 emails, mais il y a 5 tours sur des plis disjoints : au total les 1000 emails ont chacun été testé exactement une fois."}, {"id": "q4b", "topic": "Validation croisée", "type": "single", "q": "Avec 1000 exemples et k = 5, sur combien d'exemples le modèle s'entraîne-t-il à chaque tour ?", "choices": ["200", "500", "800", "1000"], "answer": 2, "why": "k-1 plis servent à l'entraînement, soit 4 × 200 = 800."}, {"id": "q2b", "topic": "Over/Underfitting", "type": "single", "q": "Un modèle obtient 99 % de réussite sur l'entraînement et 62 % sur le test. Quel est le diagnostic ?", "choices": ["Sous-apprentissage", "Sur-apprentissage", "Le modèle est bien réglé", "Il manque des features"], "answer": 1, "why": "Excellent en entraînement, mauvais en test : le modèle a mémorisé au lieu de généraliser."}, {"id": "q2c", "topic": "Over/Underfitting", "type": "single", "q": "Un modèle obtient 58 % sur l'entraînement et 57 % sur le test. Quel est le diagnostic ?", "choices": ["Sous-apprentissage", "Sur-apprentissage", "Le modèle est parfait", "L'ensemble de test est trop petit"], "answer": 0, "why": "Il échoue déjà sur les données qu'il a vues : il est trop simple pour le problème."}, {"id": "q2d", "topic": "Over/Underfitting", "type": "single", "q": "Augmenter le paramètre de régularisation lambda a pour effet de :", "choices": ["rendre le modèle plus complexe", "contraindre le modèle et le simplifier", "accélérer la convergence", "augmenter le nombre de features"], "answer": 1, "why": "La régularisation pénalise les poids importants : elle bride le modèle. Donc lambda ↑ combat le sur-apprentissage, lambda ↓ combat le sous-apprentissage."}]}, {"id": "c3", "num": 3, "title": "Régression linéaire", "subtitle": "Modèle, fonction de coût, descente de gradient", "blurb": "Le modèle le plus simple, et celui sur lequel repose l'intuition de la descente de gradient. Deux points perdus, dont un sur une question de pure logique.", "notions": [{"section": "Le modèle et son coût", "intro": "Une droite, et une mesure de son écart aux données."}, {"kind": "def", "title": "Régression linéaire", "lead": "On cherche la droite qui passe au plus près de tous les points.", "body": "\u003cp\u003eLe modèle est f\u003csub\u003eW\u003c/sub\u003e(x) = w\u003csub\u003e1\u003c/sub\u003ex + w\u003csub\u003e0\u003c/sub\u003e. On mesure sa qualité par l'\u003cstrong\u003eerreur quadratique moyenne\u003c/strong\u003e (MSE) : la moyenne des carrés des écarts entre la prédiction et la vraie valeur.\u003c/p\u003e\u003cp\u003eOn élève au carré pour deux raisons : les erreurs positives et négatives ne se compensent pas, et les grosses erreurs sont pénalisées davantage.\u003c/p\u003e\u003cp\u003eQuestion d'examen typique : le nuage de points descend quand x augmente, donc la pente w\u003csub\u003e1\u003c/sub\u003e est \u003cstrong\u003enégative\u003c/strong\u003e. On peut répondre sans calculer, juste en regardant le signe.\u003c/p\u003e", "formula": "J(W) = (1/N) \u0026sum;\u003csub\u003ei\u003c/sub\u003e ( f\u003csub\u003eW\u003c/sub\u003e(x\u003csub\u003ei\u003c/sub\u003e) \u0026minus; y\u003csub\u003ei\u003c/sub\u003e )\u0026sup2;", "ex": "les hydrocarbures : plus il y a de carbones, PLUS la chaleur dégagée\nest négative (de -890 à -5471).  y diminue quand x augmente.\n\n  -\u003e  la pente w1 est NÉGATIVE\n  -\u003e  w0 est l'ordonnée à l'origine, proche des premières valeurs\n\nréponse : w1 = -530.9 , w0 = -569.6", "see": ["q13"]}, {"kind": "thm", "title": "Que signifie J(W) = 0 ?", "lead": "Un coût nul veut dire que tous les points sont exactement sur la droite.", "body": "\u003cp\u003eJ est une moyenne de carrés. Une somme de carrés ne vaut zéro que si \u003cstrong\u003echaque\u003c/strong\u003e terme est nul, c'est-à-dire si la prédiction est exacte pour chaque exemple.\u003c/p\u003e\u003cp\u003eCela ne veut pas dire que les y valent zéro, ni que les poids valent zéro. Cela veut simplement dire que les données sont parfaitement alignées.\u003c/p\u003e\u003cp\u003eAu passage : la fonction de coût de la régression linéaire est \u003cstrong\u003econvexe\u003c/strong\u003e, elle n'a pas de minimum local. L'argument « la descente de gradient est bloquée dans un minimum local » est donc faux ici.\u003c/p\u003e", "see": ["q15"]}, {"section": "La descente de gradient", "intro": "Le seul thème où tu as fait un sans-faute. Voici ce qu'il faut garder."}, {"kind": "algo", "title": "Descente de gradient et taux d'apprentissage", "lead": "On avance à petits pas dans le sens de la plus forte pente descendante.", "body": "\u003cp\u003eÀ chaque itération : w \u0026larr; w \u0026minus; \u0026eta; \u0026times; (gradient). Le paramètre \u0026eta; (eta) est le \u003cstrong\u003etaux d'apprentissage\u003c/strong\u003e, la taille du pas.\u003c/p\u003e\u003cp\u003eTrois faits à retenir, tous tombés à l'examen. Si \u0026eta; est \u003cstrong\u003etrop grand\u003c/strong\u003e, le coût peut \u003cem\u003eaugmenter\u003c/em\u003e au lieu de diminuer : on saute par-dessus le minimum. Si \u0026eta; est \u003cstrong\u003etrop petit\u003c/strong\u003e, ce n'est pas faux mais c'est lent — donc dire que le réduire « ne peut qu'accélérer la convergence » est faux.\u003c/p\u003e\u003cp\u003eEnfin, si on démarre \u003cstrong\u003eexactement au minimum\u003c/strong\u003e, le gradient est nul et une itération ne change rien. Et sur une fonction avec des minima locaux, le point de départ détermine où l'on atterrit : rien ne garantit la même solution.\u003c/p\u003e", "formula": "w \u0026larr; w \u0026minus; \u0026eta; \u0026nabla;J(w)", "fig": "gradient", "see": ["q14"]}], "quiz": [{"id": "q13", "exam": true, "topic": "Régression linéaire", "type": "single", "q": "Pour les hydrocarbures, la chaleur dégagée y va de -890 (1 carbone) à -5471 (8 carbones). Quelles valeurs obtiendrez-vous pour une régression f(x) = w1·x + w0 ?", "choices": ["w1 = 530.9, w0 = -1780.0", "w1 = -530.9, w0 = -569.6", "w1 = -530.9, w0 = -1780.0", "w1 = 530.9, w0 = -569.6"], "answer": 1, "why": "y décroît quand x croît, donc w1 \u003c 0. Et pour x = 1 on doit retrouver environ -890 : avec w1 = -530.9 il faut w0 ≈ -890 + 530.9 ≈ -359, ce qui désigne -569.6 plutôt que -1780."}, {"id": "q15", "exam": true, "topic": "Régression linéaire", "type": "single", "q": "On trouve des poids tels que la fonction de perte J(w1, w0) = 0. Qu'est-ce qui doit nécessairement être vrai ?", "choices": ["La descente de gradient est restée bloquée dans un minimum local", "Les points d'entraînement se trouvent exactement sur une même droite", "Il faut que w1 = 0 et w0 = 0", "Il faut que y_i = 0 pour tout i"], "answer": 1, "why": "J est une somme de carrés : elle ne s'annule que si chaque erreur est nulle, donc si tous les points sont alignés. Rien n'impose que les poids ou les y soient nuls."}, {"id": "q14", "exam": true, "topic": "Descente de gradient", "type": "multi", "q": "On minimise une fonction f(w0, w1) quelconque par descente de gradient. Quelles affirmations sont vraies ?", "choices": ["Si w1 et w0 sont initialisés au minimum global, une itération ne changera pas leurs valeurs", "Fixer le taux d'apprentissage très petit n'est pas nuisible et ne peut qu'accélérer la convergence", "Quelle que soit l'initialisation, si eta est assez petit la descente converge vers la même solution", "Si les premières itérations font augmenter f, c'est probablement que eta est trop grand"], "answer": [0, 3], "why": "Au minimum le gradient est nul, donc rien ne bouge. Un coût qui augmente signale un pas trop grand. En revanche un eta minuscule RALENTIT, et sur une fonction à minima locaux l'initialisation change le résultat."}, {"id": "q3b", "topic": "Régression linéaire", "type": "single", "q": "Quelle métrique évalue le résultat d'une régression linéaire ?", "choices": ["La matrice de confusion", "L'erreur quadratique moyenne (MSE)", "La courbe ROC", "La courbe précision/rappel"], "answer": 1, "why": "Les trois autres supposent des classes discrètes ; elles n'ont pas de sens pour une sortie continue."}]}, {"id": "c4", "num": 4, "title": "Classification", "subtitle": "Régression logistique, sigmoïde, matrice de confusion", "blurb": "Huit points en jeu entre la sigmoïde et les métriques, et tu en as obtenu deux. C'est le chapitre où le rattrapage se joue.", "notions": [{"section": "La régression logistique", "intro": "Une régression linéaire qu'on écrase entre 0 et 1 pour en faire une probabilité."}, {"kind": "def", "title": "La fonction sigmoïde", "lead": "Elle transforme n'importe quel nombre réel en une probabilité entre 0 et 1.", "body": "\u003cp\u003eh(x, W) = 1 / (1 + e\u003csup\u003e\u0026minus;W\u003csup\u003eT\u003c/sup\u003ex\u003c/sup\u003e). Trois valeurs à connaître par cœur :\u003c/p\u003e\u003cp\u003eQuand W\u003csup\u003eT\u003c/sup\u003ex est \u003cstrong\u003etrès positif\u003c/strong\u003e, h tend vers \u003cstrong\u003e1\u003c/strong\u003e. Quand il est \u003cstrong\u003etrès négatif\u003c/strong\u003e, h tend vers \u003cstrong\u003e0\u003c/strong\u003e — et jamais vers \u0026minus;1, la sigmoïde ne descend pas sous zéro. Et quand W\u003csup\u003eT\u003c/sup\u003ex = \u003cstrong\u003e0\u003c/strong\u003e, alors h = \u003cstrong\u003e0,5\u003c/strong\u003e exactement.\u003c/p\u003e\u003cp\u003eCette dernière égalité est la question 21, où tu as répondu 6. Le 6 venait de la question précédente sur la frontière de décision : c'est la valeur de x\u003csub\u003e1\u003c/sub\u003e, pas celle de W\u003csup\u003eT\u003c/sup\u003ex.\u003c/p\u003e", "formula": "h = 1 / (1 + e\u003csup\u003e\u0026minus;W\u003csup\u003eT\u003c/sup\u003ex\u003c/sup\u003e) \u0026nbsp;\u0026middot;\u0026nbsp; h = 0,5 \u0026hArr; W\u003csup\u003eT\u003c/sup\u003ex = 0", "fig": "sigmoid", "ex": "W^T x  -\u003e  h\n  -inf -\u003e  0\n    -2 -\u003e  0,12\n     0 -\u003e  0,50   \u003c- la frontière de décision\n    +2 -\u003e  0,88\n  +inf -\u003e  1", "see": ["q19", "q21"]}, {"kind": "warn", "title": "Ce que vaut la sortie du classifieur", "lead": "h(x) est la probabilité de la classe 1, pas celle de la classe prédite.", "body": "\u003cp\u003eSi h(x) = 0,2, cela signifie P(y = 1 | x) = \u003cstrong\u003e0,2\u003c/strong\u003e et donc P(y = 0 | x) = \u003cstrong\u003e0,8\u003c/strong\u003e. Le modèle prédit la classe 0, avec 80 % de confiance.\u003c/p\u003e\u003cp\u003eÀ la question 18 tu as coché l'inverse. Le réflexe à installer : \u003cstrong\u003eh, c'est toujours la probabilité du 1\u003c/strong\u003e. L'autre s'obtient par 1 \u0026minus; h.\u003c/p\u003e\u003cp\u003eCorollaire (question 20) : si un exemple de classe y = 1 est correctement classé, alors h \u003e 0,5, donc h \u003e 1 \u0026minus; h. La prédiction dépasse son complément.\u003c/p\u003e", "ex": "h(x) = 0,2\n   P(y=1 | x) = 0,2       h, c'est la proba du 1\n   P(y=0 | x) = 0,8       le complément\n   classe prédite : 0     car h \u003c 0,5\n\ny = 1 bien classé  =\u003e  h \u003e 0,5  =\u003e  h \u003e 1 - h", "see": ["q18", "q20"]}, {"kind": "algo", "title": "La frontière de décision", "lead": "Elle se trouve là où W^T x = 0, c'est-à-dire là où le modèle hésite à 50/50.", "body": "\u003cp\u003eAvec w\u003csub\u003e0\u003c/sub\u003e = \u0026minus;6, w\u003csub\u003e1\u003c/sub\u003e = 1, w\u003csub\u003e2\u003c/sub\u003e = 0, on a W\u003csup\u003eT\u003c/sup\u003ex = \u0026minus;6 + x\u003csub\u003e1\u003c/sub\u003e. La frontière est donc \u0026minus;6 + x\u003csub\u003e1\u003c/sub\u003e = 0, soit \u003cstrong\u003ex\u003csub\u003e1\u003c/sub\u003e = 6\u003c/strong\u003e : une droite verticale.\u003c/p\u003e\u003cp\u003eDe quel côté est la classe 1 ? Là où W\u003csup\u003eT\u003c/sup\u003ex \u003e 0, donc là où x\u003csub\u003e1\u003c/sub\u003e \u003e 6, c'est-à-dire à \u003cstrong\u003edroite\u003c/strong\u003e. Comme w\u003csub\u003e2\u003c/sub\u003e = 0, x\u003csub\u003e2\u003c/sub\u003e n'intervient pas : la frontière est forcément verticale.\u003c/p\u003e", "ex": "w0 = -6, w1 = 1, w2 = 0\n\n  W^T x = -6 + x1\n  frontière : -6 + x1 = 0  -\u003e  x1 = 6   (droite verticale)\n  x1 \u003e 6  -\u003e  W^T x \u003e 0  -\u003e  h \u003e 0,5  -\u003e  y = 1  (à droite)\n  x1 \u003c 6  -\u003e  y = 0                            (à gauche)", "see": ["q16"]}, {"section": "La matrice de confusion", "intro": "Trois questions, trois divisions, zéro point. C'est le gain le plus rapide de toute ta révision — et il y a un exercice minuté pour ça."}, {"kind": "def", "title": "Lire la matrice", "lead": "Quatre cases : vrais positifs, faux positifs, faux négatifs, vrais négatifs.", "body": "\u003cp\u003eDans les sujets de l'examen, les \u003cstrong\u003ecolonnes\u003c/strong\u003e sont la classe réelle et les \u003cstrong\u003elignes\u003c/strong\u003e la prédiction. La case en haut à gauche est donc TP (prédit +, réellement +), et celle en bas à droite TN.\u003c/p\u003e\u003cp\u003eLes deux erreurs : en haut à droite \u003cstrong\u003eFP\u003c/strong\u003e (on a crié au loup à tort), en bas à gauche \u003cstrong\u003eFN\u003c/strong\u003e (on a raté un vrai cas).\u003c/p\u003e", "fig": "confusion", "ex": "                   RÉEL\n                 +      -\n  PRÉDIT  +     TP     FP\n          -     FN     TN", "see": ["q23"]}, {"kind": "thm", "title": "Les trois formules", "lead": "Accuracy sur le total, précision sur la ligne, rappel sur la colonne.", "body": "\u003cp\u003e\u003cstrong\u003eAccuracy\u003c/strong\u003e = ce qu'on a bien classé sur le total = (TP+TN) / (TP+FP+FN+TN).\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePrécision\u003c/strong\u003e = parmi les cas que j'ai annoncés positifs, combien l'étaient vraiment = TP / (TP+FP). C'est la \u003cstrong\u003eligne\u003c/strong\u003e du haut.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eRappel\u003c/strong\u003e = parmi les vrais positifs existants, combien j'en ai trouvé = TP / (TP+FN). C'est la \u003cstrong\u003ecolonne\u003c/strong\u003e de gauche.\u003c/p\u003e\u003cp\u003eMoyen mnémotechnique : la \u003cem\u003eprécision\u003c/em\u003e juge mes \u003cem\u003eannonces\u003c/em\u003e (ma ligne), le \u003cem\u003erappel\u003c/em\u003e juge ma \u003cem\u003ecouverture\u003c/em\u003e de la réalité (sa colonne).\u003c/p\u003e", "formula": "acc = (TP+TN)/total \u0026nbsp;\u0026middot;\u0026nbsp; préc = TP/(TP+FP) \u0026nbsp;\u0026middot;\u0026nbsp; rappel = TP/(TP+FN) \u0026nbsp;\u0026middot;\u0026nbsp; F1 = 2·préc·rappel/(préc+rappel)", "ex": "les trois questions de ton examen, refaites :\n\nQ23  TP=94 FP=37 FN=11 TN=23    total = 165\n     accuracy = (94+23)/165 = 117/165 = 0,709  -\u003e  0,71\n\nQ24  TP=72 FP=29 FN=33 TN=31\n     rappel   = 72/(72+33) = 72/105 = 0,686   -\u003e  0,69\n\nQ25  TP=80 FP=40 FN=25 TN=20\n     précision = 80/(80+40) = 80/120 = 0,667  -\u003e  0,67", "see": ["q23", "q24", "q25"]}, {"kind": "warn", "title": "Quelle métrique pour quelle tâche", "lead": "MSE pour la régression ; confusion, ROC et précision/rappel pour la classification.", "body": "\u003cp\u003eDeux questions de l'examen portent exactement là-dessus, et il faut cocher \u003cstrong\u003etrois\u003c/strong\u003e cases pour la classification.\u003c/p\u003e\u003cp\u003eLa « courbe JAZZ » n'existe pas : c'est un distracteur.\u003c/p\u003e", "ex": "RÉGRESSION       : MSE (erreur quadratique moyenne)\nCLASSIFICATION   : matrice de confusion\n                   courbes ROC\n                   courbes précision / rappel\n\n                   (la « courbe JAZZ » n'existe pas)", "see": ["q17", "q22"]}], "quiz": [{"id": "q16", "exam": true, "topic": "Sigmoïde", "type": "single", "q": "Un classifieur logistique h(x) = g(w0 + w1·x1 + w2·x2) avec w0 = -6, w1 = 1, w2 = 0. Où se trouve la frontière de décision, et de quel côté est y = 1 ?", "choices": ["Droite verticale x1 = 6, avec y = 1 à gauche", "Droite verticale x1 = 6, avec y = 1 à droite", "Droite horizontale x2 = 6, avec y = 1 au-dessus", "Droite horizontale x2 = 6, avec y = 1 en dessous"], "answer": 1, "why": "W^T x = -6 + x1, donc la frontière est x1 = 6, verticale (w2 = 0 : x2 n'intervient pas). Pour x1 \u003e 6 on a W^T x \u003e 0 donc h \u003e 0,5 : la classe 1 est à droite."}, {"id": "q18", "exam": true, "topic": "Sigmoïde", "type": "multi", "q": "Un classifieur logistique renvoie h(x) = 0,2 sur un nouvel exemple. Cela signifie :", "choices": ["P(y=0 | x; W) = 0.8", "P(y=1 | x; W) = 0.2", "P(y=1 | x; W) = 0.8", "P(y=0 | x; W) = 0.2"], "answer": [0, 1], "why": "h est TOUJOURS la probabilité de la classe 1. Donc P(y=1) = 0,2 et P(y=0) = 1 - 0,2 = 0,8."}, {"id": "q19", "exam": true, "topic": "Sigmoïde", "type": "single", "q": "Pour la sigmoïde h = 1/(1+e^(-W^T x)), quelle affirmation est vraie ?", "choices": ["De grandes valeurs positives de W^T x rendent h proche de 1, et de grandes valeurs négatives rendent h proche de 0", "De petites valeurs positives rendent h proche de 1, et de grandes valeurs négatives rendent h proche de 0", "De petites valeurs positives rendent h proche de 0, et de grandes négatives rendent h proche de -1", "De grandes valeurs positives rendent h proche de 1, et de grandes négatives rendent h proche de -1"], "answer": 0, "why": "La sigmoïde est comprise entre 0 et 1. Elle ne vaut jamais -1 : c'est ce qui élimine deux des propositions."}, {"id": "q20", "exam": true, "topic": "Sigmoïde", "type": "single", "q": "Un exemple de classe y = 1 est correctement classé, donc h(x, W) \u003e 0,5. Qu'est-ce qui doit être vrai ?", "choices": ["h(x,W) est inférieur à (1 - y)", "h(x,W) est exactement égal à y", "h(x,W) est inférieur à (1 - h(x,W))", "h(x,W) est supérieur à (1 - h(x,W))"], "answer": 3, "why": "h \u003e 0,5 équivaut exactement à h \u003e 1 - h. La prédiction n'a aucune raison d'être exactement égale à 1."}, {"id": "q21", "exam": true, "topic": "Sigmoïde", "type": "single", "q": "Pour quelle valeur de W^T x la sigmoïde vaut-elle exactement 0,5 ?", "choices": ["0", "0,5", "1", "6"], "answer": 0, "why": "1/(1+e^0) = 1/2. C'est le point où le modèle hésite : la frontière de décision."}, {"id": "q17", "exam": true, "topic": "Métriques", "type": "single", "q": "Quelle métrique évalue le résultat d'une régression linéaire ?", "choices": ["Courbe précision / rappel", "Courbe JAZZ", "L'erreur quadratique moyenne (MSE)", "Matrice de confusion", "Courbes ROC"], "answer": 2, "why": "Toutes les autres supposent des classes discrètes. La courbe JAZZ n'existe pas."}, {"id": "q22", "exam": true, "topic": "Métriques", "type": "multi", "q": "Quelles métriques évaluent le résultat d'un problème de classification ?", "choices": ["Courbes ROC", "Courbe JAZZ", "L'erreur quadratique moyenne (MSE)", "Courbe précision / rappel", "Matrice de confusion"], "answer": [0, 3, 4], "why": "Trois cases à cocher. La MSE est pour la régression, et la courbe JAZZ est un distracteur."}, {"id": "q23", "exam": true, "topic": "Matrice de confusion", "type": "num", "q": "Matrice de confusion (lignes = prédiction, colonnes = réel) : TP = 94, FP = 37, FN = 11, TN = 23. Quelle est l'accuracy, à 0,01 près ?", "answer": 0.71, "tol": 0.005, "why": "(TP + TN) / total = (94 + 23) / (94+37+11+23) = 117 / 165 = 0,709 → 0,71."}, {"id": "q24", "exam": true, "topic": "Matrice de confusion", "type": "num", "q": "Matrice de confusion : TP = 72, FP = 29, FN = 33, TN = 31. Quel est le rappel, à 0,01 près ?", "answer": 0.69, "tol": 0.005, "why": "Rappel = TP / (TP + FN) = 72 / (72 + 33) = 72 / 105 = 0,686 → 0,69."}, {"id": "q25", "exam": true, "topic": "Matrice de confusion", "type": "num", "q": "Matrice de confusion : TP = 80, FP = 40, FN = 25, TN = 20. Quelle est la précision, à 0,01 près ?", "answer": 0.67, "tol": 0.005, "why": "Précision = TP / (TP + FP) = 80 / (80 + 40) = 80 / 120 = 0,667 → 0,67."}, {"id": "q4c", "topic": "Matrice de confusion", "type": "single", "q": "Le rappel se calcule avec :", "choices": ["TP / (TP + FP)", "TP / (TP + FN)", "(TP + TN) / total", "TN / (TN + FP)"], "answer": 1, "why": "Le rappel mesure la couverture des vrais positifs : c'est la colonne du réel positif."}, {"id": "q4d", "topic": "Sigmoïde", "type": "single", "q": "Un classifieur logistique renvoie h(x) = 0,9. Quelle est la classe prédite ?", "choices": ["0", "1", "impossible à dire", "0,9"], "answer": 1, "why": "h \u003e 0,5 donc on prédit la classe 1, avec 90 % de confiance."}]}, {"id": "c5", "num": 5, "title": "Non supervisé", "subtitle": "K-means, DBSCAN, Affinity Propagation, PCA", "blurb": "Le gros du polycopié. Les questions sont à choix multiples avec trois bonnes réponses à chaque fois — exactement celles où tu n'as coché qu'une case.", "notions": [{"section": "Le clustering", "intro": "Trouver une structure de groupes : les données d'un même groupe se ressemblent, celles de groupes différents diffèrent."}, {"kind": "algo", "title": "K-means", "lead": "On place K centres, on assigne chaque point au plus proche, on recalcule les centres, on recommence.", "body": "\u003cp\u003eL'algorithme minimise la somme des distances au carré entre chaque point et le centre de son cluster — autrement dit la \u003cstrong\u003evariance intra-cluster\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eTrois propriétés tombent systématiquement, et il faut les cocher toutes les trois : il faut \u003cstrong\u003efixer K à l'avance\u003c/strong\u003e ; les résultats \u003cstrong\u003edépendent de l'initialisation\u003c/strong\u003e ; il \u003cstrong\u003eminimise la variance intra-cluster\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eCe qui est faux : il ne trouve \u003cem\u003epas\u003c/em\u003e l'optimum global (il converge vers un minimum local, d'où l'intérêt de relancer plusieurs fois), et il n'est \u003cem\u003epas\u003c/em\u003e robuste aux valeurs aberrantes — il utilise des moyennes, pas des médianes.\u003c/p\u003e", "formula": "E({m\u003csub\u003ek\u003c/sub\u003e}) = \u0026sum;\u003csub\u003en\u003c/sub\u003e min\u003csub\u003ek\u003c/sub\u003e \u0026#8214; x\u003csub\u003en\u003c/sub\u003e \u0026minus; m\u003csub\u003ek\u003c/sub\u003e \u0026#8214;\u0026sup2;", "fig": "kmeans", "ex": "VRAI sur K-means                    FAUX sur K-means\n----------------------------------  ------------------------------------\nK doit être fixé à l'avance         il trouve l'optimum global\ndépend de l'initialisation          il est robuste aux aberrants\nminimise la variance intra-cluster    (il utilise des moyennes)\n\nhypothèses implicites : clusters sphériques, compacts, convexes,\nlinéairement séparables deux à deux.", "see": ["q27"]}, {"kind": "algo", "title": "DBSCAN", "lead": "On ne compte plus les distances aux centres, mais la densité de voisinage.", "body": "\u003cp\u003eDeux paramètres : \u0026epsilon; (le rayon du voisinage) et m (le nombre minimum de voisins pour qu'un voisinage soit dit dense).\u003c/p\u003e\u003cp\u003eTrois types de points : les \u003cstrong\u003epoints centraux\u003c/strong\u003e (au moins m voisins dans leur \u0026epsilon;-voisinage), les \u003cstrong\u003epoints frontière\u003c/strong\u003e (voisins d'un point central sans l'être eux-mêmes), et les \u003cstrong\u003epoints aberrants\u003c/strong\u003e — ni l'un ni l'autre, donc du bruit.\u003c/p\u003e\u003cp\u003eLà encore trois cases à cocher : il \u003cstrong\u003edétecte les formes arbitraires\u003c/strong\u003e, il \u003cstrong\u003eidentifie le bruit comme valeurs aberrantes\u003c/strong\u003e, il est \u003cstrong\u003efondé sur la connectivité par densité\u003c/strong\u003e. Et il n'exige \u003cstrong\u003epas\u003c/strong\u003e de fixer le nombre de clusters : il le déduit du nombre de composantes connexes du graphe d'accessibilité.\u003c/p\u003e", "fig": "dbscan", "ex": "paramètres : epsilon (rayon), m (voisins minimum)\n\npoint central  : au moins m voisins à distance \u003c epsilon\npoint frontière: voisin d'un central, mais pas central\npoint aberrant : ni l'un ni l'autre  -\u003e bruit\n\nepsilon trop faible -\u003e beaucoup de petits groupes\nepsilon trop élevé  -\u003e un seul groupe\nheuristique : graphe des k-distances, on cherche le coude\n\nLIMITE : densité supposée identique partout ; impossible de classer\nun nouveau point sans tout recalculer.", "see": ["q28"]}, {"kind": "algo", "title": "Affinity Propagation", "lead": "Les points s'échangent des messages pour élire des représentants.", "body": "\u003cp\u003eOn part d'une matrice de similarité S. On construit itérativement la matrice de \u003cstrong\u003eresponsabilité\u003c/strong\u003e R(i,k) — à quel point i estime que k ferait un bon représentant — et la matrice de \u003cstrong\u003edisponibilité\u003c/strong\u003e A(i,k) — à quel point k est disposé à représenter i.\u003c/p\u003e\u003cp\u003eLa \u003cstrong\u003ediagonale\u003c/strong\u003e de S s'appelle la \u003cem\u003epréférence\u003c/em\u003e : elle dit à quel point un point veut voter pour lui-même. Valeurs élevées → beaucoup de petits clusters ; valeurs basses → peu de gros clusters. On la fixe en général à la médiane de S.\u003c/p\u003e\u003cp\u003eAvantage : le nombre de clusters n'a pas à être fixé. Inconvénient : complexité quadratique en temps et en espace, car toute la matrice de similarité doit être calculée.\u003c/p\u003e", "see": []}, {"section": "La réduction de dimension", "intro": "PCA : trois questions à l'examen, 0,83 point obtenu."}, {"kind": "def", "title": "PCA, analyse en composantes principales", "lead": "On cherche les axes selon lesquels les données varient le plus, et on jette les autres.", "body": "\u003cp\u003eMéthode du TP : standardiser les données, calculer la \u003cstrong\u003ematrice de covariance\u003c/strong\u003e, en extraire \u003cstrong\u003evaleurs propres et vecteurs propres\u003c/strong\u003e, puis garder les composantes qui cumulent assez de variance.\u003c/p\u003e\u003cp\u003eCe qu'il faut cocher : les valeurs propres \u003cstrong\u003eindiquent la quantité d'information retenue\u003c/strong\u003e par chaque composante ; l'espace engendré par les vecteurs propres représente des features \u003cstrong\u003edécorrélées\u003c/strong\u003e ; et le problème \u003cstrong\u003epeut se résoudre par SVD sans calculer explicitement la covariance\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eAttention au piège : « décorrélées » est correct, « indépendantes » ne l'est pas — la décorrélation est une propriété d'ordre deux, plus faible que l'indépendance.\u003c/p\u003e\u003cp\u003eÀ quoi sert la PCA : \u003cstrong\u003eréduire le nombre de variables\u003c/strong\u003e et \u003cstrong\u003evisualiser en 2D ou 3D\u003c/strong\u003e. Pas à prédire, pas à regrouper.\u003c/p\u003e", "fig": "pca", "see": ["q11", "q12"]}, {"kind": "thm", "title": "Retenir 95 % de la variance", "lead": "Si 95 % de la variance est conservée, l'erreur de reconstruction vaut au plus 5 %.", "body": "\u003cp\u003eC'est la question 10, et c'est une simple lecture de formule. L'erreur de reconstruction rapportée à l'énergie totale mesure ce qu'on a \u003cstrong\u003eperdu\u003c/strong\u003e. Si l'on \u003cem\u003econserve\u003c/em\u003e 95 %, on \u003cem\u003eperd\u003c/em\u003e au plus 5 %.\u003c/p\u003e\u003cp\u003eLe rapport doit donc être \u003cstrong\u003einférieur ou égal à 0,05\u003c/strong\u003e. Le réflexe : conserver beaucoup ⟹ perdre peu ⟹ petit nombre à droite du signe ≤.\u003c/p\u003e", "formula": "\u0026sum;\u0026#8214;x\u003csub\u003ei\u003c/sub\u003e \u0026minus; x\u0026#770;\u003csub\u003ei\u003c/sub\u003e\u0026#8214;\u0026sup2; / \u0026sum;\u0026#8214;x\u003csub\u003ei\u003c/sub\u003e\u0026#8214;\u0026sup2; \u0026nbsp;\u0026le;\u0026nbsp; 0,05", "ex": "variance conservée   erreur de reconstruction\n        99 %                 \u003c= 0,01\n        95 %                 \u003c= 0,05      \u003c- la question de l'examen\n        90 %                 \u003c= 0,10", "see": ["q10"]}], "quiz": [{"id": "q27", "exam": true, "topic": "Clustering", "type": "multi", "q": "Quelles affirmations concernant K-means sont correctes ?", "choices": ["Les résultats peuvent dépendre de l'initialisation", "Il trouve toujours l'optimum global de l'objectif de clustering", "Il est robuste aux valeurs aberrantes grâce à l'utilisation des médianes", "Il nécessite de définir à l'avance le nombre de clusters K", "Il minimise la variance intra-cluster"], "answer": [0, 3, 4], "why": "Trois cases. K-means converge vers un minimum local (d'où les relances multiples) et utilise des moyennes, ce qui le rend sensible aux aberrants."}, {"id": "q28", "exam": true, "topic": "Clustering", "type": "multi", "q": "Quelles affirmations concernant DBSCAN sont correctes ?", "choices": ["Il peut identifier des points de bruit comme des valeurs aberrantes", "Il peut détecter des clusters de forme arbitraire", "Il nécessite de spécifier le nombre de clusters", "Il suppose que les clusters sont sphériques comme K-means", "Il est basé sur la connectivité par densité"], "answer": [0, 1, 4], "why": "Trois cases. DBSCAN déduit le nombre de clusters des composantes connexes du graphe d'accessibilité, et ne suppose aucune forme particulière."}, {"id": "q10", "exam": true, "topic": "PCA", "type": "single", "q": "Quelqu'un a effectué une PCA en conservant 95 % de la variance. Quelle affirmation est équivalente ?", "choices": ["L'erreur de reconstruction relative est ≤ 0,05", "L'erreur de reconstruction relative est ≥ 0,95", "L'erreur de reconstruction relative est ≥ 0,05", "L'erreur de reconstruction relative est ≤ 0,95"], "answer": 0, "why": "Conserver 95 % de la variance revient à en perdre au plus 5 %. Le rapport mesure la perte, il est donc majoré par 0,05."}, {"id": "q11", "exam": true, "topic": "PCA", "type": "multi", "q": "L'analyse en composantes principales (PCA) est utilisée pour :", "choices": ["Faire des prédictions à partir des features des échantillons", "Étiqueter ou regrouper les exemples similaires", "Visualiser les échantillons de données en 2D ou 3D", "Réduire le nombre de features décrivant les échantillons"], "answer": [2, 3], "why": "Deux cases. La PCA ne prédit rien (ce serait supervisé) et ne regroupe rien (ce serait du clustering) : elle réduit et permet de visualiser."}, {"id": "q12", "exam": true, "topic": "PCA", "type": "multi", "q": "Quelles affirmations sont correctes concernant la PCA ?", "choices": ["On peut considérer l'espace engendré par les vecteurs propres comme des features décorrélées", "On peut résoudre la PCA par SVD sans calculer explicitement la matrice de covariance", "Les valeurs propres indiquent la quantité d'information retenue par chaque composante", "On peut considérer l'espace engendré par les vecteurs propres comme des features indépendantes", "Aucune de ces réponses"], "answer": [0, 1, 2], "why": "Trois cases. Le piège est la quatrième : les composantes sont DÉCORRÉLÉES, ce qui est plus faible qu'indépendantes."}, {"id": "q5b", "topic": "Clustering", "type": "single", "q": "Dans DBSCAN, un point qui n'est ni central ni frontière est :", "choices": ["un centroïde", "un point de bruit (aberrant)", "un exemplaire", "une valeur propre"], "answer": 1, "why": "C'est précisément la définition du bruit dans DBSCAN, et ce qui lui permet de détecter les outliers."}, {"id": "q5c", "topic": "Clustering", "type": "single", "q": "Dans DBSCAN, choisir un epsilon beaucoup trop grand produit :", "choices": ["de nombreux petits groupes", "un unique groupe", "uniquement du bruit", "exactement K groupes"], "answer": 1, "why": "Tout le monde devient voisin de tout le monde : le graphe d'accessibilité est connexe."}, {"id": "q5d", "topic": "Clustering", "type": "single", "q": "Dans Affinity Propagation, à quoi sert la diagonale de la matrice de similarité ?", "choices": ["Elle fixe le nombre de clusters", "Ce sont les préférences : la tendance d'un point à se choisir lui-même", "Elle contient les distances au centroïde", "Elle stocke les valeurs propres"], "answer": 1, "why": "Des préférences élevées donnent beaucoup de petits clusters ; on les fixe souvent à la médiane de S."}]}, {"id": "c6", "num": 6, "title": "Arbres et réseaux", "subtitle": "Arbres de décision, Gini, entropie, réseaux de neurones", "blurb": "Huit points en jeu, trois obtenus. Les questions sur les arbres sont toutes à trois bonnes réponses, et celles sur les couches de sortie sont du pur par-cœur.", "notions": [{"section": "Les arbres de décision", "intro": "Une suite de questions oui/non sur les variables. Quatre questions à l'examen."}, {"kind": "def", "title": "Ce qu'est un arbre de décision", "lead": "Il découpe l'espace en rectangles, par des seuils successifs sur les variables.", "body": "\u003cp\u003eChaque nœud pose une question de la forme « x\u003csub\u003ej\u003c/sub\u003e ≤ seuil ? » et sépare les données en deux. On recommence récursivement. Chaque feuille porte une classe (ou une valeur, en régression).\u003c/p\u003e\u003cp\u003eLes cases à cocher, systématiquement au nombre de trois : ils \u003cstrong\u003eséparent selon des seuils\u003c/strong\u003e, ils \u003cstrong\u003epartitionnent récursivement l'espace\u003c/strong\u003e, ils \u003cstrong\u003egèrent numérique et catégoriel\u003c/strong\u003e, ils sont \u003cstrong\u003efacilement interprétables\u003c/strong\u003e (chaque chemin racine→feuille est une règle), et ils servent \u003cstrong\u003een classification comme en régression\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eCe qui est faux : ce ne sont pas des modèles linéaires, ils n'ont pas besoin de descente de gradient, et ils n'exigent \u003cstrong\u003epas\u003c/strong\u003e de normaliser les variables — un seuil sur une variable n'est pas affecté par son échelle.\u003c/p\u003e", "fig": "arbre", "see": ["q29", "q31"]}, {"kind": "thm", "title": "Critères de séparation", "lead": "Gini et entropie pour classer, réduction de variance pour régresser.", "body": "\u003cp\u003eÀ chaque nœud on choisit la coupure qui rend les deux sous-groupes les plus \u003cem\u003epurs\u003c/em\u003e possible. Trois critères, tous les trois corrects à l'examen :\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eImpureté de Gini\u003c/strong\u003e = 1 \u0026minus; \u0026sum; p\u003csub\u003ec\u003c/sub\u003e\u0026sup2;. \u003cstrong\u003eEntropie\u003c/strong\u003e = \u0026minus;\u0026sum; p\u003csub\u003ec\u003c/sub\u003e log\u003csub\u003e2\u003c/sub\u003e p\u003csub\u003ec\u003c/sub\u003e, d'où le gain d'information. \u003cstrong\u003eRéduction de la variance\u003c/strong\u003e, pour les arbres de régression.\u003c/p\u003e\u003cp\u003eLa perte logistique, elle, n'est pas un critère de split : c'est une fonction de coût pour la régression logistique.\u003c/p\u003e\u003cp\u003eLes deux critères sont nuls quand le nœud est pur, et maximaux quand les classes sont équiréparties.\u003c/p\u003e", "formula": "Gini = 1 \u0026minus; \u0026sum;\u003csub\u003ec\u003c/sub\u003e p\u003csub\u003ec\u003c/sub\u003e\u0026sup2; \u0026nbsp;\u0026middot;\u0026nbsp; H = \u0026minus;\u0026sum;\u003csub\u003ec\u003c/sub\u003e p\u003csub\u003ec\u003c/sub\u003e log\u003csub\u003e2\u003c/sub\u003e p\u003csub\u003ec\u003c/sub\u003e", "ex": "nœud pur              [10, 0]   Gini = 0        H = 0\néquiréparti           [5, 5]    Gini = 0,5      H = 1\ndéséquilibré          [8, 2]    Gini = 0,32     H = 0,72\n\n  Gini([8,2]) = 1 - (0,8² + 0,2²) = 1 - (0,64 + 0,04) = 0,32\n  H([8,2])   = -0,8·log2(0,8) - 0,2·log2(0,2) = 0,72", "see": ["q30"]}, {"kind": "warn", "title": "Sur-apprentissage des arbres", "lead": "Un arbre laissé libre finit par isoler chaque exemple dans sa propre feuille.", "body": "\u003cp\u003eQuestion 32, où tu as coché exactement les remèdes au lieu des causes. Ce qui \u003cstrong\u003eprovoque\u003c/strong\u003e le sur-apprentissage : des \u003cstrong\u003earbres très profonds\u003c/strong\u003e, et \u003cstrong\u003eaucune contrainte sur le nombre minimum d'échantillons par feuille\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eCe qui le \u003cstrong\u003ecombat\u003c/strong\u003e, au contraire : limiter la profondeur maximale, élaguer l'arbre (pruning), imposer un minimum d'échantillons par feuille. Ce sont les paramètres \u003ccode\u003emax_depth\u003c/code\u003e et \u003ccode\u003emin_samples_split\u003c/code\u003e du TP.\u003c/p\u003e", "ex": "PROVOQUE le sur-apprentissage    LE COMBAT\n-------------------------------  -----------------------------\narbre très profond               limiter max_depth\naucun minimum par feuille        élagage (pruning)\n                                 min_samples_split élevé", "see": ["q32"]}, {"section": "Les réseaux de neurones", "intro": "Quatre questions, dont deux de pur par-cœur sur la couche de sortie."}, {"kind": "def", "title": "À quoi sert une fonction d'activation", "lead": "À introduire de la non-linéarité — sans elle, tout le réseau se réduit à une seule couche linéaire.", "body": "\u003cp\u003eEmpiler des couches linéaires ne sert à rien : la composée de deux fonctions linéaires reste linéaire. C'est l'activation non linéaire entre les couches qui donne au réseau sa capacité à représenter des frontières complexes.\u003c/p\u003e\u003cp\u003eElle ne sert ni à régulariser, ni à normaliser les entrées, ni à garantir quoi que ce soit sur la convergence.\u003c/p\u003e", "see": ["q33"]}, {"kind": "thm", "title": "La couche de sortie : trois cas, trois activations", "lead": "Sigmoïde pour le binaire, softmax pour le multiclasse, identité pour la régression.", "body": "\u003cp\u003eLa règle se déduit de ce qu'on veut en sortie. Une \u003cstrong\u003eprobabilité unique\u003c/strong\u003e entre 0 et 1 → \u003cstrong\u003esigmoïde\u003c/strong\u003e. Une \u003cstrong\u003edistribution\u003c/strong\u003e sur plusieurs classes, dont la somme fait 1 → \u003cstrong\u003esoftmax\u003c/strong\u003e. Un \u003cstrong\u003enombre réel\u003c/strong\u003e quelconque, sans borne → \u003cstrong\u003eidentité\u003c/strong\u003e (aucune activation).\u003c/p\u003e\u003cp\u003eReLU et tanh sont des activations de couches \u003cem\u003ecachées\u003c/em\u003e : elles n'ont rien à faire en sortie.\u003c/p\u003e", "fig": "sorties", "ex": "TÂCHE                           SORTIE          ACTIVATION\n------------------------------  --------------  ----------\nclassification binaire          1 probabilité   sigmoïde\nreconnaissance de chiffres      10 probas       softmax\n  (multiclasse)                   somme = 1\nprédiction du marché boursier   1 réel          identité\n  (régression)\n\nReLU et tanh : uniquement dans les couches CACHÉES.", "see": ["q34", "q35", "q36"]}], "quiz": [{"id": "q29", "exam": true, "topic": "Arbres", "type": "multi", "q": "Parmi les affirmations suivantes concernant les arbres de décision, lesquelles sont correctes ?", "choices": ["Les arbres de décision séparent les données en fonction de seuils sur les variables", "Ils peuvent traiter à la fois des données numériques et catégorielles", "Ils nécessitent toujours une normalisation des variables pour fonctionner correctement", "Ce sont des modèles linéaires", "Ils partitionnent récursivement l'espace des variables"], "answer": [0, 1, 4], "why": "Trois cases. Un seuil n'est pas affecté par l'échelle de la variable : pas besoin de normaliser. Et découper l'espace en rectangles n'a rien de linéaire."}, {"id": "q30", "exam": true, "topic": "Arbres", "type": "multi", "q": "Quels critères sont couramment utilisés pour effectuer une séparation dans un arbre de décision ?", "choices": ["Impureté de Gini", "Perte logistique", "Gain d'information (entropie)", "Réduction de la variance"], "answer": [0, 2, 3], "why": "Trois cases. Gini et entropie pour la classification, réduction de variance pour la régression. La perte logistique est la fonction de coût de la régression logistique."}, {"id": "q31", "exam": true, "topic": "Arbres", "type": "multi", "q": "Quelles affirmations concernant les arbres de décision sont correctes ?", "choices": ["Ils peuvent être utilisés pour la classification et la régression", "Ils ne peuvent pas être utilisés pour des tâches de régression", "Ils nécessitent une descente de gradient pour l'entraînement", "Ce sont des modèles facilement interprétables", "Chaque chemin de la racine à une feuille représente une règle de décision"], "answer": [0, 3, 4], "why": "Trois cases. L'entraînement se fait par recherche gloutonne du meilleur split, pas par descente de gradient."}, {"id": "q32", "exam": true, "topic": "Arbres", "type": "multi", "q": "Quels facteurs peuvent conduire à du sur-apprentissage dans les arbres de décision ?", "choices": ["Limiter la profondeur maximale", "L'élagage de l'arbre (pruning)", "Utiliser trop peu de variables", "Des arbres très profonds", "Aucune contrainte sur le nombre minimum d'échantillons par feuille"], "answer": [3, 4], "why": "Attention au sens de la question : elle demande les CAUSES, pas les remèdes. Limiter la profondeur et élaguer sont justement les parades."}, {"id": "q33", "exam": true, "topic": "Réseaux de neurones", "type": "single", "q": "Quelle est la principale utilité d'une fonction d'activation dans un réseau de neurones ?", "choices": ["Empêcher le surapprentissage en régularisant les poids", "Introduire de la non-linéarité afin de résoudre des problèmes complexes", "Garantir que la fonction de perte converge vers un minimum global", "Normaliser les entrées afin d'accélérer la descente de gradient"], "answer": 1, "why": "Sans non-linéarité, empiler des couches revient à une seule transformation linéaire."}, {"id": "q34", "exam": true, "topic": "Réseaux de neurones", "type": "single", "q": "Pour une classification binaire, quelle est la fonction d'activation de la dernière couche ?", "choices": ["Sigmoid", "Relu", "Identity", "SoftMax", "Tanh"], "answer": 0, "why": "On veut une probabilité unique entre 0 et 1 : c'est exactement ce que produit la sigmoïde."}, {"id": "q35", "exam": true, "topic": "Réseaux de neurones", "type": "single", "q": "Pour la reconnaissance de chiffres manuscrits, quelle est la fonction d'activation de la dernière couche ?", "choices": ["Sigmoid", "Identity", "Softmax", "Tanh", "Relu"], "answer": 2, "why": "Dix classes : on veut une distribution de probabilités dont la somme vaut 1, c'est le rôle du softmax."}, {"id": "q36", "exam": true, "topic": "Réseaux de neurones", "type": "single", "q": "Pour une régression prédisant le marché boursier, quelle est la fonction d'activation de la dernière couche ?", "choices": ["Sigmoid", "Tanh", "Softmax", "Relu", "Identity"], "answer": 4, "why": "La sortie est un réel non borné : toute activation écraserait la valeur. On n'en met donc aucune, c'est l'identité."}, {"id": "q6b", "topic": "Arbres", "type": "single", "q": "Quelle est l'impureté de Gini d'un nœud parfaitement pur ?", "choices": ["0", "0,5", "1", "cela dépend du nombre de classes"], "answer": 0, "why": "Une seule classe : p = 1, donc Gini = 1 - 1² = 0. L     r+=tx(310,y+15,detail,W,9,"start");
    return r;}
  s+=tx(215,14,"la couche de SORTIE dépend de la tâche",W,10.5);
  s+=row(28,"classification binaire","sigmoïde",A1,"1 proba");
  s+=row(70,"multiclasse (chiffres)","softmax",A2,"n probas, somme 1");
  s+=row(112,"régression","identité",WA,"1 réel libre");
  s+=tx(215,154,"ReLU et tanh : uniquement en couches cachées",BA,9.5);
  return s+"</svg>";};

/* ---------- drills aléatoires ---------- */
function cm(){ return {tp:rnd(40,120), fp:rnd(10,60), fn:rnd(8,50), tn:rnd(15,70)}; }
function cmTxt(m){
  return "                  RÉEL\n                +       -\n"+
   "  PRÉDIT  +   "+String(m.tp).padStart(3)+"     "+String(m.fp).padStart(3)+"\n"+
   "          -   "+String(m.fn).padStart(3)+"     "+String(m.tn).padStart(3);
}
var DRILLS=[
 {id:"acc", t:"Accuracy", d:"(TP + TN) / total", gen:function(){var m=cm();
   return {q:cmTxt(m)+"\n\naccuracy = ?", a:(m.tp+m.tn)/(m.tp+m.fp+m.fn+m.tn),
     s:"(TP+TN)/total = ("+m.tp+"+"+m.tn+")/"+(m.tp+m.fp+m.fn+m.tn)};}},
 {id:"prec", t:"Précision", d:"TP / (TP + FP) — la ligne du haut", gen:function(){var m=cm();
   return {q:cmTxt(m)+"\n\nprécision = ?", a:m.tp/(m.tp+m.fp),
     s:"TP/(TP+FP) = "+m.tp+"/"+(m.tp+m.fp)};}},
 {id:"rec", t:"Rappel", d:"TP / (TP + FN) — la colonne de gauche", gen:function(){var m=cm();
   return {q:cmTxt(m)+"\n\nrappel = ?", a:m.tp/(m.tp+m.fn),
     s:"TP/(TP+FN) = "+m.tp+"/"+(m.tp+m.fn)};}},
 {id:"f1", t:"F1-score", d:"2·P·R / (P+R)", gen:function(){var m=cm();
   var P=m.tp/(m.tp+m.fp), R=m.tp/(m.tp+m.fn);
   return {q:cmTxt(m)+"\n\nF1 = ?", a:2*P*R/(P+R),
     s:"P="+r2(P)+", R="+r2(R)+", F1=2PR/(P+R)"};}},
 {id:"sig", t:"Sigmoïde", d:"h = 1/(1+e^-z)", gen:function(){
   var z=(rnd(-30,30))/10;
   return {q:"W^T x = "+z.toFixed(1)+"\n\nh = 1/(1+e^(-W^T x)) = ?", a:1/(1+Math.exp(-z)),
     s:"1/(1+e^(-("+z.toFixed(1)+"))) ; rappel : z=0 -> 0,5"};}},
 {id:"proba", t:"Probabilité de la classe 0", d:"P(y=0) = 1 - h", gen:function(){
   var h=rnd(5,95)/100;
   return {q:"le classifieur renvoie h(x) = "+h.toFixed(2)+"\n\nP(y = 0 | x) = ?", a:1-h,
     s:"h est la proba du 1, donc P(y=0) = 1 - "+h.toFixed(2)};}},
 {id:"gini", t:"Impureté de Gini", d:"1 - somme des p²", gen:function(){
   var a=rnd(1,19), b=rnd(1,19), n=a+b;
   return {q:"un nœud contient "+a+" exemples de classe A\net "+b+" de classe B  (total "+n+")\n\nGini = ?",
     a:1-Math.pow(a/n,2)-Math.pow(b/n,2),
     s:"1 - ("+a+"/"+n+")² - ("+b+"/"+n+")²"};}},
 {id:"entro", t:"Entropie", d:"-somme p·log2(p)", gen:function(){
   var a=rnd(1,19), b=rnd(1,19), n=a+b, p=a/n, q=b/n;
   return {q:"un nœud contient "+a+" exemples de classe A\net "+b+" de classe B  (total "+n+")\n\nentropie = ?",
     a:-(p*Math.log2(p)+q*Math.log2(q)),
     s:"-"+r2(p)+"·log2("+r2(p)+") - "+r2(q)+"·log2("+r2(q)+")"};}},
 {id:"pca", t:"Variance expliquée (PCA)", d:"part cumulée des valeurs propres", gen:function(){
   var v=[rnd(30,60),rnd(15,29),rnd(5,14),rnd(1,4)];
   var tot=v[0]+v[1]+v[2]+v[3];
   return {q:"valeurs propres : "+v.join(", ")+"\n\npart de variance des 2 premières composantes = ?",
     a:(v[0]+v[1])/tot, s:"("+v[0]+"+"+v[1]+")/"+tot};}},
 {id:"kfold", t:"Validation croisée", d:"taille d'entraînement par tour", gen:function(){
   var n=rnd(2,20)*100, k=[4,5,8,10][rnd(0,3)];
   return {q:n+" exemples, validation croisée à k = "+k+"\n\nnombre d'exemples d'ENTRAÎNEMENT par tour = ?",
     a:n*(k-1)/k, tol:0.5, s:n+" × "+(k-1)+"/"+k+"  (le test en compte "+(n/k)+")"};}},
 {id:"mse", t:"MSE", d:"moyenne des carrés des écarts", gen:function(){
   var y=[rnd(1,9),rnd(1,9),rnd(1,9)], p=[rnd(1,9),rnd(1,9),rnd(1,9)];
   var m=(Math.pow(y[0]-p[0],2)+Math.pow(y[1]-p[1],2)+Math.pow(y[2]-p[2],2))/3;
   return {q:"y réel   : "+y.join(", ")+"\ny prédit : "+p.join(", ")+"\n\nMSE = ?", a:m, tol:0.02,
     s:"moyenne des (y - ŷ)² sur les 3 points"};}},
 {id:"front", t:"Frontière de décision", d:"où W^T x = 0", gen:function(){
   var w0=-rnd(2,12), w1=rnd(1,4);
   return {q:"h(x) = g(w0 + w1·x1 + w2·x2)\nw0 = "+w0+" , w1 = "+w1+" , w2 = 0\n\nla frontière est en x1 = ?",
     a:-w0/w1, tol:0.02, s:"w0 + w1·x1 = 0  ->  x1 = "+(-w0)+"/"+w1};}},
 {id:"grad", t:"Un pas de gradient", d:"w ← w - eta·grad", gen:function(){
   var w=rnd(1,20), g=rnd(-40,40)/10, e=[0.1,0.2,0.5][rnd(0,2)];
   return {q:"w = "+w+" , gradient = "+g.toFixed(1)+" , eta = "+e+"\n\nnouveau w = ?",
     a:w-e*g, tol:0.02, s:w+" - "+e+"×("+g.toFixed(1)+")"};}}
];

function questions(list, box, examMode, onAnswer){
  var w=el('<div class="qwrap"></div>');
